# Every Blood Magic chat text: reactions, the rite, the voice naming a final target, notes.
# Part of wildmagic/bloodmagic (Magic's hidden blood path). Hidden content: never on the wiki.

# Blood path. Hidden content: keep these lines vague and never quote them on the wiki.
blood:

  corruption:
    unbreakable: "#8a0303§oThe stone pulses warm under your tool. It belongs to the altar now"
  altar:

    placed: "#8c8c8c§oThe stone settles into the dark as if it had always been there. Somewhere below, something sighs"

    not_yours: "#8c8c8c§oThe stone is cold and heavy in your hands. It will not be laid down by you"

    inert: "#8c8c8c§oIt is only a stone. Nothing listens to it yet"

    already: "#8c8c8c§oYou already keep a stone. It would not share you"

    unbreakable: "#8c8c8c§oYour tools ring off the stone without leaving a scratch"
    # The pedestals the altar set out around itself will not be picked up, carried or broken.
    pedestal_bound: "#8c8c8c§oThe pedestal will not leave the stone's side"
    # Placing or breaking anything in an altar's chamber (staff with magic.blood.bypass may).
    room_locked: "#8c8c8c§oThe chamber belongs to the stone. It will not be changed by your hand"

    # Sitting on the altar (/sit) to meditate; right-clicking it gives owner_touch / stranger_touch.
    sit: "#8a0303§oYou sit on the stone. It is warm beneath you, and it is listening"
    sit_stranger: "#8c8c8c§oThe stone is cold under you. You cannot shake the feeling that it would rather you stood"
    owner_touch: "#8a0303§oThe stone is warm under your palm, like skin. You feel it breathe"

    stranger_touch: "#8c8c8c§oCold carved stone, dark in the seams. The longer you look at it, the less you want to touch it"

    place:

      world: "#8c8c8c§oNot here. The ground itself refuses it"

      occupied: "#8c8c8c§oThere is no room for the stone here"

      no_floor: "#8c8c8c§oIt needs firm rock beneath it"

      sky: "#8c8c8c§oNot under the open sky. It must never see the sun"

      shallow: "#8c8c8c§oNot deep enough. Take it further down, under more rock"

      room_too_much: "#8c8c8c§oThe stone wants a chamber of its own: open floor {size} by {size}, {height} high, with it in the middle. Too much rock is in the way here"
      room_blocked: "#8c8c8c§oThe stone wants a chamber of its own, {size} by {size} and {height} high, but something here will not make way: water, a chest, another stone, or claimed ground"
      room_shallow: "#8c8c8c§oCarving its chamber here would open the rock to the sky. Go deeper"
      room_sealed: "#8c8c8c§oOnce laid, its chamber cannot be changed. Leave it a way out first: an opening two blocks high in a wall"
      region: "#8c8c8c§oThis ground is claimed and watched. Find somewhere forgotten"

  animal:

    bind:

      ok: "#8a0303§oThe beast goes rigid on the stone. Its heart hammers against the blade. Now"

      not_stage: "#8c8c8c§oThe stone wants nothing from it. Not yet"

      not_knife: "#8c8c8c§oThis blade means nothing to the stone. Use the plain knife"

      no_altar: "#8c8c8c§oThere is no stone to lay it on"

      not_species: "#8c8c8c§oThe stone does not hunger for that"

      # Lines starting {god} or {self} are said in that voice's colours (voices.yml colors).
      known: "{god}I have tasted that kind already, child. Bring me another"

      cooldown: "{god}Not yet, child. The stone is still drinking the last one"

      not_stolen: "{god}Not that one. A gift that costs nothing is no gift. Take what others keep"

      too_far: "{god}Too far. Lead it down to the stone"

      busy: "{god}One at a time. Finish what lies on the stone"

    spoiled: "#8c8c8c§oThe blood runs into the dirt, wasted. The stone did not drink"

    escaped: "#8c8c8c§oThe beast thrashes free of the stone and bolts into the dark"

    accepted: "#8a0303§oThe stone drinks. When you take your hand away, it is warmer than before"

    complete: "#8a0303§oSeven kinds. The stone is red to its heart, and something cold and winding rests in your hand that was not there before"

    note: "#aaaaaa§oSomething has taken {animal} from the pen. The rope was cut clean, and faint drag marks lead off to the {direction}"

    note_lost: "#aaaaaa§oSomething has taken {animal} from the pen. The rope was cut clean, and no one saw a thing"

  rite:

    bind:

      ok: "#8a0303§oYou haul them onto the stone. It is already warm. Already waiting"

      not_stage: "#8c8c8c§oThe stone does not want them. Not yet"

      not_knife: "#8c8c8c§oThat blade will not open the way. Use the one the stone gave you"

      no_altar: "#8c8c8c§oThere is no stone to lay them on"

      no_character: "#8c8c8c§oThere is nothing in them to take"

      not_down: "#8c8c8c§oThey still fight. Bring them down first"

      too_far: "#8c8c8c§oThe stone is too far. Crouch, take hold of them, and drag them closer"

      too_new: "#8c8c8c§oThin, new blood. The stone would spit it out"

      repeat: "#8c8c8c§oThat blood is still drying on the stone. Find someone else"

      reserved: "{self}Not them. Not yet. They are for later"

      waiting: "#8c8c8c§oThe stone sulks over what was stolen from it. It will take no one yet"

      not_target: "#8c8c8c§oNot this one. You know whose name it whispered"

      busy: "#8c8c8c§oOne at a time"

      blocked: "#8c8c8c§oStone lies between them and the altar. Drag them to it"

    dread: "#8a0303§oCold stone under your back. A blade above you. And below, something old and patient opens its mouth"

    broken: "#8c8c8c§oThe rite comes apart. The stone goes cold and quiet, sulking"

    refused: "#8c8c8c§oThe stone will not take them"

    taken: "#7a7a7a§oIt is done. You feel heavier, and stronger, and very far from who you were"

  carry:

    start: "#8a0303§oYou take hold of them. Heavy, limp and warm. The stone is waiting"

    dragged: "#8c8c8c§oHands on you. You are being dragged over the ground, and you cannot stop it"

    released: "#8c8c8c§oYou let them fall"

    broken: "#8c8c8c§oYour grip slips. They are out of your hands"

  hunt:

    complete: "#7a7a7a§oSeven measures of blood. Something in you closes like a fist. The stone knows your name now, and no father gave it"

  final:

    named_god: "I have chosen, child. {target}. Bring me {target}"

    named_self: "{target}. It has to be {target}. I think I always knew"

    nobody_god: "No one is close enough to you yet. Love someone, child. Then bring them to your father"

    nobody_self: "There is no one close enough yet. I will have to let someone in"

    taken: "#7a7a7a§oA hollow opens where they used to be, and something cold flows in to fill it"

    ascended: "#5c0202§oThe last of them is gone. Nothing holds you now. Nothing ever will again"

    failed_god: "Someone else spilled what was mine, and you let them. You will bleed for it, child"

    failed_self: "Someone else got to them first. Everything I put into them, wasted"

  choice:

    devoted: "#8a0303§oSomething of you stays on the stone, and something of the Blood Father comes with you. It hurts. It will always hurt"

    refused: "#6e6878§oLorvear falls silent. For the first time in weeks you are alone with your own thoughts. You are almost sure they are your own"

  armour:

    refuses: "#8c8c8c§oIt will not sit on you. It knows whose blood it was made for"

    crumbles: "#8c8c8c§oIt crumbles to rust and dried blood in your hands"

  direction:

    north: "north"

    northeast: "north-east"

    east: "east"

    southeast: "south-east"

    south: "south"

    southwest: "south-west"

    west: "west"

    northwest: "north-west"

  admin:

    usage: "#aaaaaaUsage: /magic blood list | info <player> | stage <player> <stage> | path <player> <path> | give <player> <altar|ritual_knife|blood_knife> | whisper <player> [amount] | voice <player> | target <player> <list|reroll|skip|set <name>> | bonds <player> | altar <info|tp|refresh|purify> <player|altar id> | reset <player>"

    no_record: "#aaaaaa{player} ({character}) has no blood path."

    info: "#d10202{player} #aaaaaa({character}) stage #ffffff{stage}#aaaaaa, path #ffffff{path}#aaaaaa, whisper #ffffff{whisper}#aaaaaa, species #ffffff{species_count}/7 #555555[{species}]#aaaaaa, hunt #ffffff{hunt}#aaaaaa, finals #ffffff{finals}#aaaaaa, progress #ffffff{progress}#aaaaaa, altar #ffffff{altar}"

    list_header: "#d10202Blood altars: #ffffff{count}"

    list_line: "#aaaaaa- #ffffff{id} #aaaaaacharacter #ffffff{character} #aaaaaaat #ffffff{where} #aaaaaalevel #ffffff{level}"

    bad_stage: "#ff5555Unknown stage. Use one of: {stages}"

    bad_path: "#ff5555Unknown path. Use one of: {paths}"

    bad_item: "#ff5555Unknown item. Use altar, ritual_knife or blood_knife."

    stage_set: "#55ff55{player} is now at stage {stage}."

    path_set: "#55ff55{player} is now on path {path}."

    given: "#55ff55Gave {player} a bound {item}."

    reset: "#55ff55{player}'s blood path was cleared and any altar purified."

    no_altar: "#ff5555No altar found for {target}."

    altar_refreshed: "#55ff55Altar refreshed at level {level}."

    altar_purified: "#55ff55Altar at {where} purified."

    tp_unavailable: "#ff5555Only in-game staff can teleport, and the altar's world must be loaded."

    whispered: "#55ff55The voices now speak to {player}. The first line comes within a minute."

    already_whispered: "#ff5555{player} already hears the voices."

    whisper_added: "#55ff55{player}'s whisper meter is now {value} (voices woke: {woke})."

    no_voices: "#ff5555{player} does not hear any voices."

    voiced: "#55ff55{player} heard the next line."

    not_final: "#ff5555{player} is not at the final sacrifices."

    no_character_named: "#ff5555No living character is called {name}."

    targets: "#d10202{player} #aaaaaafinals done #ffffff{done}#aaaaaa, targets #ffffff{targets}"

    bonds_header: "#d10202{player} #aaaaaahas bonds with #ffffff{count} #aaaaaacharacter(s):"

    bonds_line: "#aaaaaa{rank}. #ffffff{name} #555555({score})"
