# The whisper meter that wakes the voices, and every timed line the two voices say.
# Part of wildmagic/bloodmagic (Magic's hidden blood path). Hidden content: never on the wiki.

# Hidden whisper meter. Dark deeds fill it; past threshold the voices start. It slowly drains.
whispers:
  threshold: 30
  decay_per_hour: 1.0
  # Characters with one of these RPCharacters traits fill the meter faster (the evil fast route).
  fast_traits: [heretic]
  fast_multiplier: 3.0
  sources:
    # Killing a listed animal with a blade.
    animal_kill: 2.0
    # Animal kills count this many times more at night or with nobody near.
    alone_or_night_multiplier: 2.0
    # A character you killed died for good.
    character_kill: 15.0
    # Every ten minutes while your equilibrium is at or below corruption_below.
    corruption: 1.0
    corruption_below: -40
  animal_types: [COW, PIG, SHEEP, CHICKEN, GOAT, RABBIT, HORSE, DONKEY, MULE, LLAMA, CAMEL, MOOSHROOM, WOLF, FOX, CAT, OCELOT, PARROT]

# The two voices. The god is Lorvear, the first vampire, the Blood Father: ancient, regal and paternal,
# he calls the mage "child". The other voice is the mage's own thoughts: from the knife on it answers
# him half the time (animal and choice lines), and it is all a mage hears once they refuse him.
# Keep both inside blood magic: no other gods, orders or schools.
# whispered lines are said in order and end with the knife and altar. animal lines come in tiers by
# kinds given (the highest number reached; a plain list instead slides a third of the way along it).
# Animal-stage voices speak only in the altar's chamber, while it is ready for the next kind and no rite
# is under way (with no altar standing, they keep quiet). Other stages pick at random.
# Colours: each voice is a gradient that drifts from colors.start to colors.end over the whole path
# (kinds, the answer, the hunt, the finals). Lorvear starts dim and grows into the bright Bloodmagic
# reds; the mage's own voice starts pale and clear, as they are, and sinks into dark blood.
# style is put after every colour (italics). Without colors, style is the whole prefix as before.
voices:
  # Minutes between lines, picked at random in this range.
  interval_minutes: [15, 35]
  # Only speak when no other player is within alone_radius blocks.
  require_alone: true
  alone_radius: 24
  god:
    style: "§o"
    colors:
      start: ["#6b1f1f", "#561515"]
      end: ["#aa0000", "#d10202", "#e80505"]
    sound: minecraft:ambient.cave
    pitch: 0.5
    lines:
      whispered:
        - "...there. Under the stone. A heartbeat that is not your own."
        - "Do not be afraid. It has been so long since anyone listened."
        - "So much warm blood walks the roads. Spilled in ditches and brawls and childbeds. All of it wasted."
        - "One called Alaric listened, once, long before your grandfather's grandfather. He wasted nothing."
        - "Go down, deep, where the sky cannot follow. No banner, no warden's eye. Lay the stone there."
        - "Bring living beasts down to it. Hold them still with the plain knife, and let the stone drink."
        - "Not beasts of your own. A gift that costs nothing is no gift. Take them from another's pen while the keeper sleeps."
        - "Seven kinds, one each day and no sooner. I can wait. I have waited longer than your kingdoms have had names."
        - "Look in your pack. Someone has been generous. Do not make them regret it."
      # By kinds given: the lines under the highest number reached.
      animal:
        0:
          - "The stone is thirsty, child. Can you not hear it?"
          - "Do not be afraid of the knife. Be afraid of a life where nothing ever bled for you."
          - "Every pen in the valley is full, and every shepherd sleeps."
          - "Lead it down gently. Fear sours the blood."
        1:
          - "There. Was that so hard? Feel how the stone remembers you now."
          - "Do not look away when it bleeds. Looking away is how blood is wasted."
          - "Look into its eyes when you do it. I want to see what you see."
          - "Wash your hands before you climb back up. They can smell it on you."
        3:
          - "I remember the taste of the last one. Bring me a kind I have not had."
          - "Your hands are steadier than they were. I noticed. I notice everything you give me."
          - "You hold the knife the way I used to. Do you feel it? We are becoming alike."
        5:
          - "Each kind you bring wakes a little more of me. Soon you will feel me waking too."
          - "Almost seven, child. The stone is nearly red to its heart, and so are you."
          - "When the last one bleeds, come down to me. I will have a gift for you, and a question."
      choice:
        - "Seven kinds have bled. Come down to the stone, and bring the winding blade. Your father has a question."
        - "The stone is red to its heart. Kneel at it with the blade in your hand, child."
        - "Do not keep me waiting. Nothing that lives has kept me waiting for long."
      final:
        - "You are my child now, and so are they. I will tell you which of them."
        - "I have chosen for you. You need not think any more. Only go to the stone."
        - "Do you remember their laugh? Remember it on the stone. It makes them sweeter."
        - "They trust you. That is what makes it holy."
        - "The grave is greedy, and the dead are cold. I prefer them warm, and given freely by someone they loved."
        - "Every drop you give me, I remember. Every drop, I repay."
      ascended:
        - "All of them, given. Sleep now, my child. Your father will wake you when he is hungry."
        - "You walk among them and none of them know. You are more mine than Alaric ever was."
        - "Let them send their hunters. I have outlived every one of them."
  self:
    style: "§o"
    colors:
      start: ["#d8d2e0", "#bdb6c9"]
      end: ["#8a0303", "#5c0202", "#4a0a14"]
    sound: minecraft:entity.warden.heartbeat
    pitch: 1.2
    lines:
      animal:
        0:
          - "What am I doing down here? It's only a stone. Only a voice."
          - "I could still throw the knife in the river. Nobody would ever know."
          - "Someone will wake to an empty pen and never know why. Someone who never did anything to me."
          - "My hands won't stop shaking. Good. They should shake."
          - "If I do this once, I don't think I get to be who I was."
        1:
          - "I keep seeing its eyes. It didn't even struggle."
          - "It's only an animal. People eat them every day. This is no different."
          - "The farmer will buy another. The stone has no one else."
          - "I told myself once would be enough. It wasn't."
        3:
          - "My hands didn't shake this time. I noticed, and then I stopped caring that I noticed."
          - "I've started counting the kinds without meaning to."
          - "Nobody tells you how warm it is. Nobody tells you how good the warmth feels."
          - "I sleep fine now. That should frighten me more than it does."
        5:
          - "I washed my hands three times today. I didn't need to. I liked how red the water went."
          - "I caught myself looking at a neighbour's goats and wondering how they'd bleed."
          - "It's only work now. Hold, cut, wait. The stone is grateful. That's more than most are."
          - "Seven kinds, and then it's finished. Then what? Then more, I hope."
      choice:
        - "Kneel? To him? I have never knelt to anyone."
        - "Father. As if I need another one."
        - "Everything he gives, he owns. What if I took it, and owed no one?"
        - "He wants a child on its knees. I could be so much more than his child."
        - "Listen past his voice. Underneath it there is a quiet. The quiet is honest."
      hunt:
        - "I don't need a father to tell me what I want."
        - "Lorvear went quiet. Let him sulk under his stone. I can hear myself think."
        - "Strangers are cheap. The ones I know are worth more. I knew that before anyone told me."
        - "Nobody notices one more empty chair. Not at first."
        - "Seven measures. I keep counting, even when I pretend I'm not."
        - "They smiled at me today. They have no idea."
        - "Warm, he wanted them. Why warm? Cold keeps."
      final:
        - "It has to be them. I've known it for days."
        - "The closer they are, the more it gives. That's the whole trick, isn't it?"
        - "I'll be quick. I owe them that much."
        - "If I stop now, everything before was for nothing."
        - "Their name keeps coming back. Of course it does."
        - "Afterwards it is so still. I could live in that stillness."
      ascended:
        - "There is no one left I would miss. So this is what freedom feels like."
        - "They would call me evil. They'd be right. And far too late."
        - "Quiet. So quiet. No god, no father. I did it all myself."
        - "...and in the quiet, something old and patient is smiling. It sounds like me."
