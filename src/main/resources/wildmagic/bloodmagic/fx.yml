# Sounds and particles for every moment of the path.
# Part of wildmagic/bloodmagic (Magic's hidden blood path). Hidden content: never on the wiki.

# Sounds and particles for every moment of the path. Each moment is a list of layers:
#   sound: <key> (volume, pitch)
#   particle: <Bukkit Particle> (count, spread: n or [x, y, z], speed, y offset, color/to/size for dust,
#     block for BLOCK/FALLING_DUST/BLOCK_CRUMBLE, item for ITEM, value for SCULK_CHARGE/SHRIEK)
#   shape: point | ring | column | spiral (radius, points, height); delay: ticks; private: true = only the
#   player the moment is about sees or hears it; chance: 0-1 how often the layer plays (default 1);
#   jitter: up to this many extra ticks of random wait. A moment with no entry plays nothing.
# Look: red and black for the stone, the blood and the mage; amber embers (#fcac03 cooling to #5c0202)
# only for Lorveor, so they vanish for good once a mage refuses him. Heartbeats by pitch: the stone's
# slow heart 0.5-0.6, a living victim's 0.9-1.0, the mage's own 1.2.
# tfmc_blood:* sounds are the server pack's own events (ServerAssets tfmc_blood sounds.json): vanilla
# recordings under neutral subtitles, so players with subtitles on do not read "Warden roars".
fx:
  enabled: true
  # Vanilla candle flames over the wicks of the altar's candles (the model draws no flames of its own),
  # every every_ticks while a player is within view_range, with a wisp of smoke at smoke_chance.
  # wicks: [x, y, z, max_level] in the model's pixels, 1 px over the middle of each wick like vanilla,
  # max_level the last altar level that still has that candle. yaw_offset turns the positions to match
  # how item displays face.
  candles:
    enabled: true
    particle: SMALL_FLAME
    every_ticks: 8
    smoke_chance: 0.1
    view_range: 24
    yaw_offset: 180
    wicks:
      - [14, 17, 2, 5]
      - [14, 18, 14, 5]
      - [2, 17, 14, 5]
      - [2, 16, 2, 5]
  # Shared sounds reach only players this many blocks away; private: true layers reach only
  # the player the moment is about (the rite music in animals.yml is private too).
  hear_radius: 10
  moments:
    # --- The altar ---
    altar_placed:
      - { sound: block.stone.place, volume: 1.0, pitch: 0.5 }
      - { sound: block.respawn_anchor.charge, volume: 0.4, pitch: 0.5, delay: 6 }
      - { particle: BLOCK_CRUMBLE, block: stone_bricks, count: 30, spread: 0.4, y: 0.1 }
      - { particle: DUST, color: "#4a0000", size: 1.2, shape: ring, radius: 0.9, points: 14, y: -0.4, delay: 6 }
      - { sound: "tfmc_blood:father", volume: 0.5, pitch: 0.5, delay: 20, private: true }
    altar_awakens:
      - { sound: "tfmc_blood:heart", volume: 1.2, pitch: 0.5 }
      - { sound: item.firecharge.use, volume: 0.5, pitch: 0.5, delay: 4 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.6, shape: spiral, radius: 0.8, height: 2.2, points: 40, y: -0.5, delay: 4 }
      - { particle: FALLING_DUST, block: redstone_block, count: 18, spread: [0.45, 0.1, 0.45], y: 0.55, delay: 10 }
    altar_purified:
      - { sound: block.beacon.deactivate, volume: 1.0, pitch: 0.6 }
      - { sound: block.fire.extinguish, volume: 0.8, pitch: 0.5 }
      - { particle: WHITE_ASH, count: 60, spread: [1.2, 0.8, 1.2], y: 0.5 }
      - { particle: END_ROD, shape: column, height: 2.5, points: 12, speed: 0.02 }
      - { particle: LARGE_SMOKE, count: 12, spread: 0.3, y: 0.4, speed: 0.02 }
    altar_touch_owner:
      - { sound: "tfmc_blood:heart", volume: 0.6, pitch: 0.6, private: true }
      - { particle: DUST, color: "#8a0303", size: 1.0, count: 6, spread: 0.25, y: 0.6, private: true }
    altar_touch_stranger:
      - { sound: block.stone.hit, volume: 0.6, pitch: 0.6 }
      - { sound: ambient.soul_sand_valley.mood, volume: 0.3, pitch: 1.6, private: true }
    # Every 3 seconds while someone is within 24 blocks, by altar level (level 0 stays silent).
    # Played every 3 s while someone is near; chance and jitter keep the drips from ticking like a clock.
    # Only the level 5 heart keeps a steady beat.
    altar_ambient_1:
      - { particle: FALLING_DUST, block: redstone_block, count: 1, spread: [0.35, 0, 0.35], y: 0.45, chance: 0.7, jitter: 50 }
    altar_ambient_2:
      - { particle: FALLING_DUST, block: redstone_block, count: 2, spread: [0.4, 0, 0.4], y: 0.45, jitter: 50 }
      - { particle: DUST, color: "#4a0000", size: 1.2, count: 3, spread: 0.3, y: 0.7, chance: 0.6, jitter: 40 }
    altar_ambient_3:
      - { particle: FALLING_DUST, block: redstone_block, count: 3, spread: [0.45, 0, 0.45], y: 0.45, jitter: 50 }
      - { particle: DUST, color: "#4a0000", size: 1.4, count: 4, spread: 0.35, y: 0.8, chance: 0.6, jitter: 40 }
      - { particle: CRIMSON_SPORE, count: 6, spread: 1.5, y: 0.8, jitter: 30 }
      - { sound: block.pointed_dripstone.drip_lava, volume: 0.4, pitch: 0.6, chance: 0.4, jitter: 50 }
    altar_ambient_4:
      - { particle: FALLING_DUST, block: redstone_block, count: 4, spread: [0.45, 0, 0.45], y: 0.45, jitter: 50 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 1.4, shape: ring, radius: 0.75, points: 10, y: 0.6, chance: 0.5, jitter: 30 }
      - { particle: CRIMSON_SPORE, count: 10, spread: 2.0, y: 1.0, jitter: 30 }
      - { sound: block.pointed_dripstone.drip_lava, volume: 0.5, pitch: 0.5, chance: 0.5, jitter: 50 }
      - { sound: "tfmc_blood:heart", volume: 0.25, pitch: 0.6, delay: 20, chance: 0.5 }
    altar_ambient_5:
      - { particle: FALLING_DUST, block: redstone_block, count: 6, spread: [0.5, 0, 0.5], y: 0.45, jitter: 50 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.6, shape: spiral, radius: 0.7, height: 1.6, points: 24, y: 0.4, chance: 0.5, jitter: 30 }
      - { particle: DUST, color: "#4a0000", size: 1.2, count: 2, spread: 0.3, y: 0.7, chance: 0.6, jitter: 40 }
      - { particle: CRIMSON_SPORE, count: 16, spread: 2.5, y: 1.0, jitter: 30 }
      - { sound: "tfmc_blood:heart", volume: 0.5, pitch: 0.5 }
      - { sound: ambient.crimson_forest.additions, volume: 0.4, pitch: 0.6, delay: 30, chance: 0.3, jitter: 20 }
    corruption:
      - { sound: block.honey_block.slide, volume: 0.5, pitch: 0.5 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 1.2, count: 4, spread: 0.4 }
      - { particle: DUST, color: "#4a0000", size: 1.2, count: 6, spread: 0.45 }

    # --- The animals ---
    animal_bound:
      - { sound: block.chain.place, volume: 0.5, pitch: 0.6 }
      - { particle: DUST, color: "#4a0000", size: 1.2, shape: ring, radius: 0.8, points: 12, y: 0.6 }
      - { particle: DUST, color: "#4a0000", size: 1.3, shape: column, height: 1.4, points: 10, y: 0.5 }
    animal_binding:
      - { particle: DUST, color: "#8a0303", size: 1.3, count: 4, spread: 0.15, y: 0.6 }
      - { particle: DUST, color: "#8a0303", size: 0.9, count: 3, spread: 0.3, y: 0.4 }
    animal_cut:
      - { sound: entity.player.attack.sweep, volume: 0.5, pitch: 0.7 }
      - { sound: item.trident.hit, volume: 0.4, pitch: 0.6 }
      - { particle: SWEEP_ATTACK, count: 1, y: 0.6 }
      - { particle: BLOCK, block: redstone_block, count: 30, spread: 0.3, y: 0.6, speed: 0.15 }
      - { particle: DUST, color: "#8a0303", size: 1.4, count: 14, spread: 0.4, y: 0.4 }
    # Every second while it bleeds: blood running down onto the stone, the stone drinking it in.
    animal_bleeding:
      - { particle: FALLING_DUST, block: redstone_block, count: 6, spread: [0.3, 0.1, 0.3], y: 0.3 }
      - { particle: DUST, color: "#6e0000", size: 1.1, count: 5, spread: [0.35, 0.2, 0.35], y: 0.1 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.0, shape: ring, radius: 0.9, points: 14, y: -0.4 }
    # Its heart, slower toward the end; only its mage hears it up close.
    animal_heartbeat:
      - { sound: "tfmc_blood:heart", volume: 0.5, pitch: 0.95, private: true }
      - { particle: DUST, color: "#8a0303", size: 1.3, count: 4, spread: 0.15, y: 0.6 }
    animal_spilled:
      - { sound: block.fire.extinguish, volume: 0.4, pitch: 0.6 }
      - { sound: entity.generic.splash, volume: 0.4, pitch: 0.5 }
      - { particle: BLOCK, block: redstone_block, count: 20, spread: [0.6, 0.1, 0.6], y: 0.0, speed: 0.05 }
      - { particle: LARGE_SMOKE, count: 6, spread: 0.3, y: 0.4, speed: 0.01 }
    animal_escaped:
      - { sound: block.chain.break, volume: 0.5, pitch: 0.8 }
      - { particle: POOF, count: 8, spread: 0.3, y: 0.5 }
    altar_sit:
      - { sound: "tfmc_blood:heart", volume: 0.6, pitch: 0.6, private: true }
      - { particle: DUST, color: "#5c0202", size: 1.0, shape: ring, radius: 0.7, points: 10, y: 0.6, private: true }
    corruption_unbreakable:
      - { sound: block.honey_block.break, volume: 0.7, pitch: 0.5, private: true }
      - { particle: DUST, color: "#8a0303", size: 1.2, count: 14, spread: 0.45, private: true }
    animal_sacrificed:
      - { sound: entity.player.attack.crit, volume: 0.4, pitch: 0.5 }
      - { sound: block.honey_block.slide, volume: 0.5, pitch: 0.5 }
      - { sound: block.lava.pop, volume: 0.5, pitch: 0.5, delay: 4 }
      - { sound: "tfmc_blood:heart", volume: 0.5, pitch: 0.6, delay: 12 }
      - { particle: BLOCK, block: redstone_block, count: 40, spread: 0.4, y: 0.7, speed: 0.1 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.5, shape: ring, radius: 1.2, points: 20, y: 0.6, delay: 4 }
      - { particle: DUST, color: "#4a0000", size: 1.3, shape: column, height: 1.8, points: 8, y: 0.6, delay: 8 }
    blood_knife_given:
      - { sound: item.firecharge.use, volume: 0.4, pitch: 0.6, delay: 20 }
      - { sound: block.respawn_anchor.charge, volume: 0.4, pitch: 0.5, delay: 40 }
      - { particle: DUST_COLOR_TRANSITION, color: "#fcac03", to: "#5c0202", size: 2.0, shape: spiral, radius: 1.3, height: 3.5, points: 70, y: -0.5, delay: 20 }
      - { particle: DUST_COLOR_TRANSITION, color: "#fcac03", to: "#5c0202", size: 1.2, shape: ring, radius: 2.2, points: 30, y: -0.4, delay: 30 }
      - { sound: "tfmc_blood:father", volume: 0.5, pitch: 0.5, delay: 50, private: true }

    # --- The question ---
    question:
      - { sound: block.portal.ambient, volume: 0.4, pitch: 0.5, private: true }
      - { sound: "tfmc_blood:presence", volume: 0.8, pitch: 0.5, private: true }
      - { particle: DUST, color: "#1a0000", size: 2.0, shape: ring, radius: 1.0, points: 16, y: 0.1, private: true }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.4, shape: ring, radius: 1.4, points: 24, y: 0.6, delay: 8, private: true }
    devoted:
      - { sound: "tfmc_blood:father", volume: 0.8, pitch: 0.5 }
      - { sound: entity.player.hurt, volume: 1.0, pitch: 0.6, delay: 10 }
      - { sound: block.respawn_anchor.charge, volume: 0.8, pitch: 0.5, delay: 20 }
      - { particle: DUST_COLOR_TRANSITION, color: "#fcac03", to: "#5c0202", size: 1.8, shape: spiral, radius: 0.9, height: 2.4, points: 50 }
      - { particle: BLOCK, block: redstone_block, count: 30, spread: 0.4, y: 1.0, delay: 10 }
      - { particle: DUST_COLOR_TRANSITION, color: "#fcac03", to: "#5c0202", size: 1.2, shape: ring, radius: 1.6, points: 24, delay: 20 }
    refused:
      - { sound: block.respawn_anchor.deplete, volume: 1.0, pitch: 0.5 }
      - { sound: block.candle.extinguish, volume: 1.0, pitch: 0.5, delay: 8 }
      - { sound: "tfmc_blood:curse", volume: 0.5, pitch: 0.5, delay: 30, private: true }
      - { particle: LARGE_SMOKE, count: 30, spread: [0.6, 1.0, 0.6], y: 1.0, speed: 0.01 }
      - { particle: SQUID_INK, shape: ring, radius: 1.4, points: 20, y: 0.2, delay: 8 }

    # --- Dragging and the rite ---
    carry_start:
      - { sound: entity.player.attack.knockback, volume: 0.8, pitch: 0.6 }
      - { sound: block.chain.step, volume: 0.8, pitch: 0.6 }
      - { sound: "tfmc_blood:heart", volume: 1.0, pitch: 1.2, private: true }
      - { particle: DUST, color: "#8a0303", size: 1.2, count: 8, spread: 0.3, y: 0.2 }
    # Every few steps: the scrape of a body and a smear of blood on the ground behind it.
    carry_drag:
      - { sound: block.mud.step, volume: 0.6, pitch: 0.6 }
      - { particle: DUST, color: "#5c0202", size: 1.4, count: 3, spread: [0.25, 0, 0.25], y: 0.05 }
      - { particle: BLOCK, block: redstone_block, count: 2, spread: 0.15, y: 0.1 }
    carry_released:
      - { sound: entity.player.small_fall, volume: 1.0, pitch: 0.6 }
      - { particle: BLOCK_CRUMBLE, block: dirt, count: 10, spread: 0.3, y: 0.1 }
    rite_bound:
      - { sound: block.chain.place, volume: 1.0, pitch: 0.5 }
      - { sound: item.firecharge.use, volume: 0.5, pitch: 0.5, delay: 6 }
      - { particle: DUST, color: "#4a0000", size: 1.2, shape: ring, radius: 1.3, points: 20, y: -0.4 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 1.6, shape: column, height: 2.5, points: 16, y: 0.5, delay: 6 }
      - { sound: "tfmc_blood:curse", volume: 0.6, pitch: 0.4, private: true }
    # Every second of the rite: the victim's heart.
    rite_beat:
      - { sound: "tfmc_blood:heart", volume: 1.2, pitch: 0.95 }
      - { particle: DUST, color: "#8a0303", size: 1.3, count: 4, spread: 0.15, y: 1.0 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.4, shape: ring, radius: 1.0, points: 14, y: 0.6 }
      - { particle: DUST, color: "#4a0000", size: 1.1, count: 2, spread: 0.6, y: 0.2 }
      - { sound: "tfmc_blood:heart", volume: 1.0, pitch: 1.0, delay: 10, private: true }
    rite_broken:
      - { sound: block.chain.break, volume: 1.0, pitch: 0.6 }
      - { sound: block.glass.break, volume: 0.6, pitch: 0.5 }
      - { particle: LARGE_SMOKE, count: 16, spread: 0.4, y: 0.8, speed: 0.02 }
    rite_complete:
      - { sound: "tfmc_blood:burst", volume: 0.6, pitch: 0.6 }
      - { sound: block.honey_block.slide, volume: 1.0, pitch: 0.4 }
      - { sound: entity.lightning_bolt.thunder, volume: 0.4, pitch: 0.5, delay: 6 }
      - { sound: block.lava.pop, volume: 1.0, pitch: 0.4, delay: 12 }
      - { particle: BLOCK, block: redstone_block, count: 80, spread: 0.6, y: 0.9, speed: 0.15 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 2.0, shape: ring, radius: 1.5, points: 30, y: 0.5, delay: 3 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 2.0, shape: ring, radius: 2.6, points: 42, y: 0.3, delay: 7 }
      - { particle: DUST, color: "#8a0303", size: 1.2, shape: spiral, radius: 0.6, height: 3.0, points: 30, y: 0.5, delay: 10 }

    # --- The hunt and the finals ---
    hunt_complete:
      - { sound: block.respawn_anchor.charge, volume: 0.8, pitch: 0.6 }
      - { sound: block.lava.ambient, volume: 0.8, pitch: 0.5, delay: 20 }
      - { sound: "tfmc_blood:moan", volume: 0.4, pitch: 0.5, delay: 40, private: true }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 2.2, shape: spiral, radius: 1.2, height: 3.0, points: 70 }
      - { particle: FLAME, shape: ring, radius: 1.8, points: 28, y: 0.1, speed: 0.01, delay: 20 }
      - { particle: DUST, color: "#4a0000", size: 1.2, count: 30, spread: [1.0, 1.5, 1.0], y: 1.0, delay: 30 }
    target_named:
      - { sound: block.bell.resonate, volume: 0.6, pitch: 0.5, private: true }
      - { sound: "tfmc_blood:curse", volume: 0.4, pitch: 0.5, delay: 10, private: true }
      - { particle: DUST, color: "#1a0000", size: 1.6, count: 20, spread: [0.6, 1.0, 0.6], y: 1.0, private: true }
    # A loved one's heart slowing to a stop, a breath of silence, then one bell.
    final_taken:
      - { sound: "tfmc_blood:heart", volume: 0.8, pitch: 1.0, delay: 30 }
      - { sound: "tfmc_blood:heart", volume: 0.5, pitch: 0.95, delay: 50 }
      - { sound: "tfmc_blood:heart", volume: 0.3, pitch: 0.9, delay: 80 }
      - { sound: block.bell.use, volume: 0.4, pitch: 0.5, delay: 120 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.4, shape: ring, radius: 1.2, points: 18, y: 0.1, delay: 120 }
      - { sound: block.amethyst_block.resonate, volume: 0.5, pitch: 0.5, delay: 120, private: true }
    ascended:
      - { sound: "tfmc_blood:growl", volume: 0.6, pitch: 0.5, delay: 20 }
      - { sound: "tfmc_blood:roar", volume: 0.3, pitch: 0.5, delay: 40 }
      - { sound: block.lava.ambient, volume: 0.6, pitch: 0.4, delay: 60 }
      - { particle: DUST_COLOR_TRANSITION, color: "#ff1a1a", to: "#1a0000", size: 2.5, shape: spiral, radius: 1.5, height: 4.0, points: 90, delay: 20 }
      - { particle: FLAME, shape: ring, radius: 2.5, points: 40, y: 0.1, speed: 0.02, delay: 40 }
      - { particle: CRIMSON_SPORE, count: 80, spread: [3.0, 2.0, 3.0], y: 1.5, delay: 60 }
    # Can happen anywhere (a named target died some other way): only the mage sees the marks.
    backlash:
      - { sound: entity.player.hurt, volume: 1.0, pitch: 0.5 }
      - { sound: "tfmc_blood:curse", volume: 0.6, pitch: 0.6, private: true }
      - { sound: "tfmc_blood:cackle", volume: 0.6, pitch: 0.5, delay: 20, private: true }
      - { particle: DUST, color: "#8a0303", size: 1.3, count: 10, spread: [0.3, 0.6, 0.3], y: 1.0, private: true }
      - { particle: SQUID_INK, count: 16, spread: 0.5, y: 1.0, speed: 0.02, private: true }

    # --- The voices ---
    voice_god:
      - { particle: DUST_COLOR_TRANSITION, color: "#fcac03", to: "#5c0202", size: 0.7, count: 5, spread: [0.6, 0.4, 0.6], y: 1.7, private: true }
    voice_self:
      - { particle: SMOKE, count: 8, spread: [0.4, 0.3, 0.4], y: 1.6, speed: 0.005, private: true }
      - { particle: REVERSE_PORTAL, count: 4, spread: [0.3, 0.2, 0.3], y: 1.7, speed: 0.01, private: true }
      - { sound: block.portal.ambient, volume: 0.12, pitch: 1.8, private: true }
    gift:
      - { sound: "tfmc_blood:presence", volume: 0.6, pitch: 0.6, private: true }
      - { particle: DUST_COLOR_TRANSITION, color: "#fcac03", to: "#5c0202", size: 1.3, shape: ring, radius: 0.8, points: 12, y: 0.2, private: true }

    # --- The armour ---
    armour_given:
      - { sound: item.armor.equip_leather, volume: 1.0, pitch: 0.6 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 1.4, shape: column, height: 2.0, points: 14 }
    # --- Artefacts and meditation ---
    artefact_charge:
      - { sound: entity.generic.splash, volume: 0.5, pitch: 0.5 }
      - { sound: block.lava.pop, volume: 0.6, pitch: 0.6, delay: 10 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.4, shape: ring, radius: 0.5, points: 16, y: 0.1 }
    artefact_charge_beat:
      - { sound: "tfmc_blood:heart", volume: 0.6, pitch: 0.55 }
      - { particle: FALLING_DUST, block: redstone_block, count: 4, spread: [0.3, 0.05, 0.3], y: 0.2 }
    artefact_charged:
      - { sound: block.respawn_anchor.charge, volume: 0.6, pitch: 0.6 }
      - { sound: block.amethyst_block.resonate, volume: 0.5, pitch: 0.5, delay: 4, private: true }
      - { particle: DUST_COLOR_TRANSITION, color: "#d10202", to: "#3a0000", size: 1.4, shape: spiral, radius: 0.5, height: 1.2, points: 24 }
    meditate_catch:
      - { sound: block.honey_block.break, volume: 0.6, pitch: 0.6, private: true }
      - { sound: block.amethyst_cluster.hit, volume: 0.4, pitch: 0.5, private: true }
    meditate_miss:
      - { sound: entity.player.hurt, volume: 0.5, pitch: 0.7, private: true }
    armour_crumbles:
      - { sound: entity.item.break, volume: 1.0, pitch: 0.5 }
      - { sound: block.soul_sand.break, volume: 0.8, pitch: 0.6 }
      - { particle: ASH, count: 30, spread: [0.3, 0.6, 0.3], y: 1.0 }
      - { particle: DUST, color: "#3a1a1a", size: 1.2, count: 12, spread: 0.4, y: 0.8 }
