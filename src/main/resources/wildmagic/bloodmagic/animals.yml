# The animal sacrifices.
# Part of wildmagic/bloodmagic (Magic's hidden blood path). Hidden content: never on the wiki.

# Animal sacrifices: bind a living animal on the altar with the ritual knife, cut it with that knife, and
# stay by the stone while it bleeds out. Only then does the sacrifice count.
animal:
  species_required: 7
  # Rolling window between two animal sacrifices.
  cooldown_hours: 24
  # How close to the altar the animal must be when the knife binds it.
  bind_range: 4
  # A bound animal breaks free after this many seconds.
  bind_seconds: 20
  # The rite after the cut: it bleeds out on the stone this long while its mage stays within stay_range
  # blocks of the altar (further, or switching character or leaving, spills it, wasted). Its heart beats
  # at these seconds of the bleeding, slowing toward the end.
  rite:
    bleed_seconds: 15
    stay_range: 4
    heartbeats: [0, 1, 2, 3, 5, 7, 10, 13]
    # Played to the mage alone from the cut, stopped when the stone drinks or the blood is spilled.
    # sound: a resource pack sound id (blank for none); category: the client volume slider it follows.
    music:
      sound: tfmc_blood:rite.bleed
      category: RECORDS
      volume: 0.8
  # Only animals another player owns (Cooking husbandry) count.
  require_stolen: true
  # The offering leaves no meat or experience behind.
  clear_drops: true
  species: [COW, PIG, SHEEP, CHICKEN, GOAT, RABBIT, HORSE, DONKEY, MULE, LLAMA, CAMEL, MOOSHROOM, WOLF, FOX, CAT, OCELOT, PARROT]
  # Where a stolen animal was led away from, a small trace stays this long.
  trace:
    model: ia.tfmc_blood:trace
    hours: 6
  # The owner hears about it this many minutes later, or on their next login.
  note_delay_minutes: 30
