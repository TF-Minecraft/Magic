# PoC parts. Fran tunes socket counts, items, and costs.
# Ceiling is 4 empty sockets on the finished weapon; extras are dropped at craft.
# part-limit: extra part categories a core unlocks (mandatory once that core is chosen).
# stats: MMOItems ids with doubles, same shape as cost — attack_damage(4).
# model-scheme: scheme id, optional weight like iron(10). Looked up in model-schemes.yml.

