# PoC parts. Fran tunes socket counts, items, and costs.
# Ceiling is 4 empty sockets on the finished weapon; extras are dropped at craft.

timber_core:
  name: "§7Timber Core"
  part-type: core
  type:
    - staff
    - wand
    - sword
  item: v.oak_log
  cost:
    - v.oak_log(2)
  sockets: {}
  lore:
    - "§8The spine of the piece"

oak_shaft:
  name: "§7Oak Shaft"
  part-type: form
  type:
    - staff
  item: v.stick
  cost:
    - v.stick(4)
  sockets:
    projectile: 1
    support: 1
  lore:
    - "§8Staff form: projectile and support"

steel_blade:
  name: "§7Steel Blade"
  part-type: form
  type:
    - sword
  item: v.iron_ingot
  cost:
    - v.iron_ingot(3)
  sockets:
    support: 1
    spell: 1
  lore:
    - "§8Sword form: support and spell"

amber_focus:
  name: "§7Amber Focus"
  part-type: focus
  type:
    - staff
  item: v.glowstone_dust
  cost:
    - v.glowstone_dust(2)
  sockets:
    minor_spell: 1
    major_spell: 1
  lore:
    - "§8Staff focus: two spell sockets"

glass_focus:
  name: "§7Glass Focus"
  part-type: focus
  type:
    - wand
  item: v.glass
  cost:
    - v.glass(2)
  sockets:
    minor_spell: 1
    major_spell: 1
  lore:
    - "§8Wand focus: two spell sockets"
