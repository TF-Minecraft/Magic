# Mage weapon archetypes. Templates are TLibs MMOItems paths Fran owns.
# slots: id -> TLibs colour suffix. Prefix comes from socket-colours.yml.
# Colour written = "{prefix} {suffix}", e.g. "Rare Staff Projectile Rune".

staff:
  name: Staff
  template: m.mage_staffs.mage_iron_staff
  melee: false
  required:
    - core
    - form
    - focus
  slots:
    projectile: "Staff Projectile Rune"
    support: "Staff Support Rune"
    minor_spell: "Staff Minor Spell Rune"
    major_spell: "Staff Major Spell Rune"

wand:
  name: Wand
  template: m.magic.wand_template
  melee: false
  required:
    - core
    - focus
  slots:
    minor_spell: "Wand Minor Spell Rune"
    major_spell: "Wand Major Spell Rune"

sword:
  name: Sword
  template: m.magic.sword_template
  melee: true
  required:
    - core
    - form
  slots:
    support: "Sword Support Rune"
    spell: "Sword Spell Rune"
