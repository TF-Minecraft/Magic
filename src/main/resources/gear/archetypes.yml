# Mage weapon archetypes. Templates are TLibs MMOItems paths Fran owns.
# slots: id -> TLibs colour suffix. Prefix comes from socket-colours.yml.
# By default only the suffix is written, matching the school runes' gem-color.
# icon: ItemRef path for picker/assembly GUIs (v.MATERIAL, m.TYPE.ID, ia.namespace:id).
# item-name: crafted weapon name. %material% is the core's material, and the whole name
#   takes its colour. Defaults to "%material% <name>".

staff:
  name: Staff
  item-name: "%material% Mage Staff"
  template: m.mage_staffs.mage_custom_staff
  icon: m.mage_staffs.mage_custom_staff
  melee: false
  required:
    - core
    - handle
    - tome
    - tome2
    - tome3
  slots:
    minor_rune: "Minor Rune"
    lesser_rune: "Lesser Rune"
    greater_rune: "Greater Rune"
    ascendant_rune: "Ascendant Rune"

wand:
  name: Wand
  item-name: "%material% Mage Wand"
  template: m.mage_wands.mage_custom_wand
  icon: m.mage_wands.mage_custom_wand
  melee: false
  required:
    - core
    - handle
    - tome
  slots:
    minor_rune: "Minor Rune"
    lesser_rune: "Lesser Rune"
    greater_rune: "Greater Rune"
    ascendant_rune: "Ascendant Rune"

sword:
  name: Sword
  item-name: "%material% Mage Blade"
  template: m.mage_swords.mage_custom_sword
  icon: m.mage_swords.mage_custom_sword
  melee: true
  required:
    - core
    - handle
    - tome
  slots:
    minor_rune: "Minor Rune"
    lesser_rune: "Lesser Rune"
    greater_rune: "Greater Rune"
    ascendant_rune: "Ascendant Rune"
