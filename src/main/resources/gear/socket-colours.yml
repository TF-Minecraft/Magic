# Resonance band -> TLibs colour prefix.
# Colour string = prefix + " " + archetype slot suffix.
# Must match tlibs socket-tier-groups keys exactly.

prefix:
  default: Common
  1: Common
  2: Rare
  3: Epic
  4: Legendary

# Socket slot id -> player-facing name in the assembly GUI.
labels:
  projectile: Projectile
  support: Support
  minor_spell: Minor Spell
  major_spell: Major Spell
  spell: Spell
