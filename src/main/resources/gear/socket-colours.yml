# Resonance band -> TLibs colour prefix.
# Colour string = prefix + " " + archetype slot suffix (when config gear.socket_rarity_prefix is true).
# Must match tlibs socket-tier-groups keys exactly.
# Set gear.socket_rarity_prefix: false in config.yml to write suffix only (no Common/Rare/Epic/Legendary).

prefix:
  default: Common
  1: Common
  2: Rare
  3: Epic
  4: Legendary

# Socket slot id -> player-facing name in the assembly GUI.
labels:
  minor_rune: Minor Rune
  lesser_rune: Lesser Rune
  greater_rune: Greater Rune
  asecandt_rune: Ascendant Rune
  minor_armor_rune: Minor Armor Rune
  lesser_armor_rune: Lesser Armor Rune
  greater_armor_rune: Greater Armor Rune
  asecandt_armor_rune: Ascendant Armor Rune
