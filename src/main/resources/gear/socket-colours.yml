# Resonance band -> TLibs colour prefix.
# Prefix is used only when gear.socket_rarity_prefix is true (default: false).
# School runes use the suffix alone; it must match TLibs' mage_runes group exactly.

prefix:
  default: Common
  1: Common
  2: Rare
  3: Epic
  4: Legendary

# Socket slot id -> player-facing name in the assembly GUI.
labels:
  minor_rune: Minor Rune
  lesser_rune: Lesser Rune
  greater_rune: Greater Rune
  ascendant_rune: Ascendant Rune
  minor_armor_rune: Minor Armor Rune
  lesser_armor_rune: Lesser Armor Rune
  greater_armor_rune: Greater Armor Rune
  ascendant_armor_rune: Ascendant Armor Rune
