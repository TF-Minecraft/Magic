# skill id -> element + tier (MythicLib / MMOItems). Jar does not overwrite a live copy.
#
# The id is the MythicLib skill handler id, lowercase, which is what an MMOItems
# ability reports. Flat or nested both work:
#
# arcanum_bolt: arcanum
#
# arcanum_bolt:
#   element: arcanum
#   tier: 1
#
# element: which weapon imbue and player resonance gate the cast, and which alignment
# band the weapon contributes. A skill with no binding is never gated.
#
# tier: 1-4 (Minor / Lesser / Greater / Ascendant). The weapon must hold that element
# at this band, and the caster's resonance must meet the same band. Omitted tier is 1.

