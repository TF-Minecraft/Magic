# Class spells (MMOCore subclasses) are deliberately NOT bound here: a binding would let
# Magic's resonance modifiers, weapon gating and wear act on class casts. Their element
# and rune tier are recorded where they live:
#   MythicMobs/skills/TFMC/Classes/tfmc_<element>_skills.yml ('Class exclusive' sections)
#   MythicLib/skill/tfmc_<element>.yml (class-exclusive spells and CLASS_ copies of runes)
#   MMOCore/classes/<subclass>.yml (element and tier comment above each spell)
