# skill id -> element id (MythicLib / MMOItems). Jar does not overwrite a live copy.
#
# The id is the MythicLib skill handler id, lowercase, which is what an MMOItems
# ability reports. Flat or nested both work:
#
# arcanum_bolt: arcanum
#
# arcanum_bolt:
#   element: arcanum
#
# The element decides two things: which weapon requirement gates the cast, and which
# alignment band the weapon contributes. A skill with no binding is never gated.
