reload:

  success: "#55ff55[Magic] Configs reloaded."

  failed: "#ff5555[Magic] Reload failed - check console."

cast_mode:

  switched: "#55ff55Casting mode set to {mode}."

open:

  players_only: "#ff5555Only players can open the Resonance GUI."

  no_character: "#ff5555You need an active character to view resonance."

  no_permission: "#ff5555You feel no resonance within you."

admin:

  no_permission: "#ff5555You do not have permission to use this command."

  usage: "#aaaaaaUsage: /magic <player|resonance|equilibrium|castmode|gear|artifact|rune|weapon|reload|open|fillchest|shrine|refresh|blood>"

values:
  save_failed: "#ff5555Could not save this Magic edit. The character values were restored; check console."
  player_usage: "#aaaaaaUsage: /magic player <get|reset> <player> | /magic equilibrium <get|set|add|remove|reset> <player> [amount] | /magic castmode <get|set|reset> <player> [mode]"
  item_usage: "#aaaaaaUsage: /magic artifact inspect | /magic artifact fill <get|set|add|remove|reset> <element|all> [amount] | /magic artifact <muffle|wear> <get|set|add|remove|reset> [amount] | /magic gear inspect | /magic gear <rift|durability> <get|set|add|remove|reset> [amount]"
  players_only: "#ff5555This command edits the item in a player's main hand."
  wrong_item: "#ff5555Hold an identified artifact or a Magic weapon, as appropriate. Spent husks cannot be edited."
  single_item: "#ff5555Hold exactly one item before editing it."
  invalid_amount: "#ff5555Use a finite amount. Removal needs a nonnegative magnitude; gear values need whole numbers within the integer range."
  invalid_mode: "#ff5555Unknown casting mode. Use a mode from tab completion."
  player: "#aaaaaa{player} (character {character}): equilibrium {equilibrium}, casting {mode}."
  focus: "#aaaaaaFocus: {value} (managed with /focus)."
  item_id: "#aaaaaaArtifact: {id}"
  item: "#aaaaaa{field}: {value}"
  fill: "#aaaaaa{element} aura: {value}/{max}"
  no_durability: "#ff5555This weapon has no editable durability."
  wear_disabled: "#ff5555Artifact wear is disabled in config."

rune:

  usage: "#aaaaaaUsage: /magic rune keybind <trigger>"

  players_only: "#ff5555Only players can rebind a held rune."

  no_permission: "#ff5555You are not skilled enough to rebind runes."

  not_a_rune: "#ff5555Hold a rune to rebind its abilities."

  no_abilities: "#ff5555That rune has no abilities to rebind."

  unknown_trigger: "#ff5555Unknown trigger."

  failed: "#ff5555Could not rebind that rune."

  success: "#55ff55Rebound all abilities on this rune to {trigger}."

fillchest:

  usage: "#aaaaaaUsage: /magic fillchest <element|random|all>"

  players_only: "#ff5555Only players can fill chests."

  unknown: "#ff5555Unknown artifact element. Use a type id, random, or all."

  armed: "#55ff55Right-click a chest within 30s to wipe it and fill artifacts."

  done: "#55ff55Filled {count} chest slots."

  expired: "#ff5555Fillchest click expired. Run the command again."

cast:

  # Rift: the weapon fumbled. Mana and cooldown are already spent.
  whiff: "§7*Whiff*"

  whiff_sub: "#aaaaaa§oRift {rift}%"
  
  whiff_sub_staffs: "#aaaaaa§oToo many staffs"

  # Refusal: the weapon never started. Nothing is spent, and it is never a whiff.
  refuse_title: "§7*Refused*"

  refuse_sub: "#aaaaaa§oThis spell is beyond you"

  refuse_sub_spell: "#aaaaaa§oThis spell is beyond you"

  refuse_sub_weapon: "#aaaaaa§oThis weapon cannot carry that spell"

  refuse_sub_foreign: "#aaaaaa§oThis weapon holds no {element}"

  refuse_chat: "#aaaaaaThis spell needs {element} {need}. You carry {have}."

  refuse_chat_spell: "#aaaaaaThis spell needs {element} {need}. You carry {have}."

  refuse_chat_weapon: "#aaaaaaThe weapon holds {element} {have}. This spell needs {need}."

  refuse_chat_foreign: "#aaaaaaThis weapon was never attuned to {element}. Apply a {element} charge at a station."

  # Damaged: a config revision left the weapon holding runes it can no longer seat.
  broken_title: "§7*Damaged*"

  broken_sub: "#aaaaaa§oThis weapon will not answer"

  broken_chat: "#ff5555This weapon is damaged. Right-click an empty station to reclaim its runes."

  # Worn out: the weapon is on its last point of durability. Nothing is spent until it is repaired.
  worn_title: "§7*Worn out*"

  worn_sub: "#aaaaaa§oThis weapon needs repair"

  worn_chat: "#ff5555This weapon is worn out. Repair it with a Magical Repair Kit before casting again."

resonance:

  admin:

    usage: "#aaaaaaUsage: /magic resonance get <player> #555555| #aaaaaa/magic resonance <set|add|remove> <player> <element|all> <amount> #555555| #aaaaaa/magic resonance reset <player> [element|all]"

    no_character: "#ff5555{player} has no loaded character."

    unknown_element: "#ff5555Unknown element. Use an element id or all."

    invalid_amount: "#ff5555Amount must be a number."

    get_header: "#aaaaaaResonance for {player} ({character})"

    get_line: "#aaaaaa  {element} {value}/{max}"

    set_ok: "#55ff55Set {player} {element} resonance (requested {value})."

    add_ok: "#55ff55Added {delta} {element} resonance for {player}."

    reset_ok: "#55ff55Reset {player} {element} resonance."

    locked: "#ff5555{player} lacks {permission} ({element})."

    locked_skipped: "#ff5555Skipped locked elements for {player}: {elements}"

artifact:

  husk:

    name: "#8a8a8aSpent {name}"

    lore: "#8a8a8a§oIts aura is spent. Only a recycler has a use for it now."

  usage: "#aaaaaaUsage: /magic artifact roll #555555| #aaaaaa/magic artifact give #555555| #aaaaaa/magic artifact create #555555| #aaaaaa/magic artifact path #555555| #aaaaaa/magic artifact setfill #555555| #aaaaaa/magic artifact setmuffle #555555| #aaaaaa/magic artifact unmuffle"

  path:

    usage: "#aaaaaaUsage: /magic artifact path <magic.artifact|magic.(...)>"

    invalid: "#ff5555Could not parse that artifact path. Check console."

    spec: "#aaaaaaPath spec: primary {primary} rarity {rarity} extras {extras}"

  roll:

    usage: "#aaaaaaUsage: /magic artifact roll [element|random] [rarity|roll]"

    unknown_element: "#ff5555Unknown artifact element."

    unknown_rarity: "#ff5555Unknown artifact rarity."

    empty_types: "#ff5555No artifact types are loaded."

    empty_rarities: "#ff5555No artifact rarities are loaded."

    no_bracket: "#ff5555{element} has no {rarity} bracket."

    disabled: "#ff5555{element} artifacts are disabled."

    header: "{color}{rarity}#aaaaaa {element} cap {cap}"

    secondary: "#555555  {element} cap {cap}"

  give:

    usage: "#aaaaaaUsage: /magic artifact give <player> [element|random] [rarity|roll]"

    unknown_player: "#ff5555Player {player} is not online."

    failed: "#ff5555Could not build that artifact. Check the template path."

    ok: "#55ff55Gave artifact to {player}."

  sealed:

    opened: "#c9a0ffThe seal breaks, and an artifact is yours."

    failed: "#ff5555The seal will not break. Nothing was used; please tell staff."

  create:

    usage: "#aaaaaaUsage: /magic artifact create"

    players_only: "#ff5555Only players can open the artifact editor."

    need_primary: "#ff5555Set a primary element before confirming."

    failed: "#ff5555Could not build that artifact. Check the template path."

    ok: "#55ff55Gave artifact to {player}."

  setfill:

    usage: "#aaaaaaUsage: /magic artifact setfill <element> <amount>"

    players_only: "#ff5555Only players can set artifact fill."

    no_item: "#ff5555Hold an artifact in your main hand."

    no_id: "#ff5555That item has no artifact id."

    unknown_element: "#ff5555Unknown artifact element."

    no_cap: "#ff5555That artifact has no cap for {element}."

    invalid_amount: "#ff5555Fill amount must be a number."

    ok: "#55ff55Set {element} fill to {fill}."

  setmuffle:

    usage: "#aaaaaaUsage: /magic artifact setmuffle <percent 0-100>"

    players_only: "#ff5555Only players can set artifact muffle."

    no_item: "#ff5555Hold an artifact in your main hand."

    no_id: "#ff5555That item has no artifact id."

    invalid_amount: "#ff5555Muffle must be a number from 0 to 100."

    ok: "#55ff55Set artifact muffle to {muffle}%."

  unmuffle:

    usage: "#aaaaaaUsage: /magic artifact unmuffle"

    players_only: "#ff5555Only players can unmuffle artifacts."

    no_item: "#ff5555Hold an artifact in your main hand."

    no_id: "#ff5555That item has no artifact id."

    ok: "#55ff55Cleared artifact muffle ({muffle}%)."

