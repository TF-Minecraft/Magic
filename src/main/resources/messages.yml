    bind:

      ok: "#8a0303§oIt goes still on the stone. Its heart hammers. Now"

      not_stage: "#8c8c8c§oThe stone wants nothing from it"

      not_knife: "#8c8c8c§oIt is only a knife in your hand"

      no_altar: "#8c8c8c§oThere is no stone to lay it on"

      not_species: "#8c8c8c§oThe stone does not want that"

      known: "#8a0303§oWe have tasted that kind. Bring another"

      cooldown: "#8a0303§oNot yet. The stone is still drinking"

      not_stolen: "#8a0303§oNot that one. Take what others keep"

      too_far: "#8a0303§oBring it closer to the stone"

      busy: "#8a0303§oOne at a time"

    spoiled: "#8c8c8c§oThe blood spills wasted. The stone did not drink"

    escaped: "#8c8c8c§oThe beast tears free of the stone"

    accepted: "#8a0303§oThe stone drinks. It is warmer than before"

    complete: "#8a0303§oSeven kinds. The stone is red to its heart. Something new rests in your hand"

    note: "#aaaaaa§oSomething took {animal} while no one was watching. Drag marks lead {direction}"

    note_lost: "#aaaaaa§oSomething took {animal} while no one was watching"

