    not_gear: "#ff5555Hold a crafted mage weapon in your main hand."

    failed: "#ff5555Could not refresh that weapon. Check console."

    ok: "#55ff55Weapon refreshed against the live gear config."

# Blood path. Hidden content: keep these lines vague and never quote them on the wiki.
blood:

  altar:

    placed: "#8c8c8c§oThe stone settles. The air around it grows still and close"

    not_yours: "#8c8c8c§oThe stone will not settle for you"

    inert: "#8c8c8c§oIt is only a stone"

    already: "#8c8c8c§oYou already keep an altar"

    unbreakable: "#8c8c8c§oThe stone does not yield"

    owner_touch: "#8a0303§oThe stone is warm, like skin"

    stranger_touch: "#8c8c8c§oA cold, carved stone. Something about it makes you uneasy"

    place:

      world: "#8c8c8c§oThis is no place for it"

      occupied: "#8c8c8c§oThere is no room for the stone here"

      no_floor: "#8c8c8c§oThe stone needs solid ground beneath it"

      sky: "#8c8c8c§oIt must not see the sky"

      shallow: "#8c8c8c§oNot deep enough. It must lie far beneath the earth"

      region: "#8c8c8c§oThis ground is watched. Find somewhere forgotten"

