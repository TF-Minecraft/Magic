gear:

  station:

    occupied: "#aaaaaa§oThis station already holds a weapon"

    empty: "#aaaaaa§oThere is nothing on this station"

    gone: "#ff5555That station is no longer there."

    rested: "#aaaaaa§oThe weapon settles onto the station"

    not_craftable: "#aaaaaa§oThis station cannot shape that weapon"

  craft:

    lacking: "#ff5555You lack the materials for those parts."

    invalid: "#ff5555That combination cannot be prepared."

    prepared: "#aaaaaa§oThe weapon rests on the station"

    bypassed: "#ffaa00Materials were bypassed due to staff."

  charge:

    not_charge: "#ff5555That is not an enchanted charge."

    blank: "#aaaaaa§oThe charge holds no aura yet"

    no_character: "#ff5555You need an active character to charge a weapon."

    warn: "#ff5555This charge is beyond your resonance:"

    warn_line: "#aaaaaa{element}: need {need}, you have {have}"

    warn_again: "#aaaaaaRight-click again to commit anyway"

    applied: "#aaaaaa§oThe charge breaks open above the station"

  orbs:

    start: "#aaaaaaStrike the pale orbs. You need {target}. The rust ones tear the weapon"

    progress: "#aaaaaa{hits}/{target} caught  #ff5555{rift} rift  #aaaaaa{seconds}s"

    complete: "#aaaaaa§oThe weapon settles at {band}, holding {percent}% of the charge"

    failed: "#ff5555The charge scatters. Nothing takes hold."

    rift: "#ff5555The weapon is left with {rift}% rift."

    summary_title: "{color:label_accent}Imbued resonance"

    summary_line_prefix: "{color:label_muted}  "

    summary_unattuned: "{color:label_muted}None yet"

    summary_rift: "{color:corruption}Rift {color:label_muted}{rift}%"

    summary_hint_resonance: "{color:label_muted}Apply another enchanted charge to raise resonance on this weapon."

    summary_hint_resonance_and_clean: "{color:label_muted}Apply another enchanted charge to raise resonance or clean rift from this weapon."

    busy: "#aaaaaa§oThis station is already mid-attunement"

  eject:

    unattuned: "#aaaaaa§oThe weapon is inert. Shift-left-click the station to take the materials back"

  abort:

    done: "#aaaaaa§oThe craft comes apart. The charge, if any, is spent"

    returned: "#aaaaaa§oThe attunement breaks off. The weapon comes back to you"

    not_yours: "#ff5555Only the one who prepared this craft can take it apart."

  # Sneak-right-click an empty station with an attuned weapon to wipe its attunement.
  # The fee is gear.reattune.cost_fraction of the weapon's part costs (config.yml).
  reattune:

    warn: "#ff5555Re-attuning wipes this weapon's attunement and Rift once a charge takes hold. It costs:"

    free: "#aaaaaaNo materials"

    confirm: "#aaaaaaSneak-right-click again to commit"

    lacking: "#ff5555You lack the materials to re-attune this weapon."

    placed: "#aaaaaa§oThe weapon rests on the station, waiting to be attuned anew"

    locked: "#aaaaaa§oThe weapon waits to be attuned anew. Its owner can shift-left-click the station to take it and the materials back"

    kept: "#aaaaaaThe old attunement holds. Apply another charge to attune the weapon anew."

    done: "#aaaaaa§oThe old attunement is gone"

    returned: "#aaaaaa§oThe re-attunement breaks off. The weapon and the materials go back to its owner"

    not_yours: "#ff5555Only the weapon's owner can attune it anew or take it back."

    held: "#ff5555The materials for this re-attunement cannot be returned. Ask staff to take it apart."

  broken:

    charge: "#ff5555This weapon is damaged. Reclaim its runes before charging it again."

  reclaim:

    none: "#aaaaaa§oThe weapon holds no loose runes"

    done: "#aaaaaa§oYou work {count} loose rune(s) free of the weapon"

    still_broken: "#ff5555The weapon is still missing parts: {missing}. Ask staff to restore them."

