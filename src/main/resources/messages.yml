      not_knife: "#8c8c8c§oThat blade will not open the way"

      no_altar: "#8c8c8c§oThere is no stone to lay them on"

      no_character: "#8c8c8c§oThere is nothing in them to take"

      not_down: "#8c8c8c§oThey still fight. Bring them down first"

      too_far: "#8c8c8c§oThe stone is too far. Bring them closer"

      too_new: "#8c8c8c§oThin blood. The stone would not drink it"

      repeat: "#8c8c8c§oThat blood is still on the stone. Find another"

      reserved: "#7a7a7a§oNot them. Not yet. They are for later"

      waiting: "#8c8c8c§oThe stone is sullen. It will not take anyone yet"

      not_target: "#8c8c8c§oNot this one. You know who it must be"

      busy: "#8c8c8c§oOne at a time"

    dread: "#8a0303§oStone under your back. A blade above you. Something below is hungry"

    broken: "#8c8c8c§oYou step away and the rite comes apart"

    refused: "#8c8c8c§oThe stone will not take them"

    taken: "#7a7a7a§oIt is done. You feel heavier, and stronger"

  hunt:

