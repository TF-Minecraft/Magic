  complete: "#aaaaaa§oMeditation complete at this site"

  tired: "#aaaaaa§oYou are too tired to meditate now"

  stop: "#aaaaaa§oYou stop meditating"

  crumbled: "#aaaaaa§o{artifact} crumbles, its aura spent"

