main: net.tfminecraft.magic.Magic
api-version: '1.21.10'
name: Magic
version: ${project.version}
author: Drefvelin
depend: [TLibs, ItemsAdder, RPCharacters, InteractibleFurniture]
softdepend: [MMOItems, MythicLib, MMOCore]

commands:
  resonance:
    description: Open your resonance profile
    usage: /resonance
    aliases: [res]
    permission: magic.use
  magic:
    description: Magic plugin admin commands
    usage: /magic <reload|open|resonance|artifact|fillchest|shrine|refresh>
    permission: magic.admin

permissions:
  magic.use:
    description: Allows using /resonance
    default: true
  magic.admin:
    description: Allows /magic admin commands (reload, open)
    default: op
    children:
      magic.admin.reload: true
  magic.admin.reload:
    description: Legacy permission alias for magic.admin
    default: op
