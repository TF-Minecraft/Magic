# Blood Magic progression. Hidden content: never document it on the wiki.
# Jar does not overwrite an existing live copy. Copy new keys by hand after updates.
# The god is Lorvear, the first vampire, the Blood Father. The blade and class names are placeholders.

enabled: true

# Items the voices hand to the character. TLibs item paths (v., ia., m.).
# Each item is bound to the character that received it. The ia.tfmc_blood items come from the
# tfmc_blood ItemsAdder pack (ServerAssets); load it before this config, a missing IA id builds dirt.
items:
  altar:
    path: ia.tfmc_blood:altar_0
    name: "#bfbfbfWeathered Altar Stone"
    lore:
      - "#8c8c8c§oA slab of old carved stone, worn smooth"
      - "#8c8c8c§oby hands that are long gone."
      - "#5c5c5c§oIt is heavier than it should be."
  # The Ritual Knife is an MMOItems lore weapon (name, lore and look come from MMOItems).
  ritual_knife:
    path: m.lore_weapons.ritual_knife
    name: ""
    lore: []
  blood_knife:
    path: ia.tfmc_blood:blood_knife
    name: "#8a0303Vein-Reaver"
    lore:
      - "#5c0202§oCurved like a fang, and as old as one."
      - "#5c0202§oIt is warm to the touch,"
      - "#5c0202§oand if you hold it still, it beats."

altar:
  # The altar is a barrier block (unbreakable, piston and blast proof) with a display on it.
  block: BARRIER
  # Altar look per level. Level rises with the owner's progress (see levels below).
  # model is a TLibs item path shown by the display entity.
  models:
    0: ia.tfmc_blood:altar_0
    1: ia.tfmc_blood:altar_1
    2: ia.tfmc_blood:altar_2
    3: ia.tfmc_blood:altar_3
    4: ia.tfmc_blood:altar_4
    5: ia.tfmc_blood:altar_5
  display_scale: 1.0
  # Progress needed for each altar level. Animal sacrifices count 1 each,
  # the god's question +1, hunt points 1 each, final sacrifices 2 each.
  levels:
    1: 2
    2: 5
    3: 8
    4: 12
    5: 18

hunt:
  # True path: points of character sacrifices needed for the True class.
  points_required: 7
  # A knocked-out character this close to the altar can be dragged onto it with the blood knife.
  drag_range: 8
  # Seconds the rite takes. Once it starts, the character dies for good when it ends.
  rite_seconds: 10
  # Sneak and right-click a knocked-out character with the blood knife to drag the body along behind you.
  # Right-click your altar (or the body) with the knife to lay it on the altar; sneak-click the body to let go.
  carry:
    enabled: true
    # Blocks the body trails behind you.
    distance: 1.2
    # Slowness level while dragging (0 = none).
    slowness: 1
    # The drag breaks if the body ends up further away than this (teleports, pearls).
    break_distance: 6
  victims:
    # Characters of the same account never count. These keep fresh alts out too.
    min_playtime_hours: 10
    min_age_days: 7
    # The same player (any of their characters) may not be taken twice in a row.
    no_repeat_player: true
  # Hunt points by how close the victim was (rank 1 = closest). The closest finals.count are kept
  # for the final sacrifices and cannot be taken in the hunt. Strangers (no bond at all) are worth "stranger".
  points:
    stranger: 1
    default: 1
    ranks:
      - { up_to: 10, points: 3 }
      - { up_to: 25, points: 2 }

# Hidden closeness between characters. Never shown to players.
bonds:
  # Every sample, characters within near_radius of each other add the sample's minutes together.
  sample_minutes: 5
  near_radius: 16
  # Score = conversation_weight x counted RP exchanges (RPCharacters) + hour_weight x hours near each other.
  conversation_weight: 3.0
  hour_weight: 2.0
  # A will heir adds this, only if the heir is another player's character the two really spent time with.
  heir_bonus: 40
  heir_min_hours: 10
  heir_min_conversations: 20

# The final sacrifices: the closest characters, named one at a time from least close to closest.
finals:
  count: 5
  # A named target that dies any other lethal way: backlash and this wait before the next is named.
  fail_cooldown_hours: 72
  # A named target not seen for this long is quietly replaced.
  inactive_days: 21
  # MythicLib stat boons per final sacrifice (they add up). Placeholder values.
  boons:
    devotee:
      1: { MAX_HEALTH: 1 }
      2: { MAX_MANA: 10 }
      3: { MAX_HEALTH: 1 }
      4: { SPELL_DAMAGE: 2 }
      5: { MAX_HEALTH: 2 }
    "true":
      1: { MAX_HEALTH: 2 }
      2: { MAX_MANA: 20 }
      3: { MAX_HEALTH: 2 }
      4: { SPELL_DAMAGE: 4 }
      5: { MAX_HEALTH: 4 }

placement:
  # Worlds where an altar may stand. Empty = every world.
  worlds: []
  # Underground: no sky light at the altar and at least min_cover solid blocks above it.
  require_underground: true
  min_cover: 3
  cover_scan_height: 48
  # Refuse any WorldGuard region except the ids listed here (needs WorldGuard).
  deny_regions: true
  allowed_regions: []
  # How often (minutes) altars of dead owners are checked and purified.
  purify_check_minutes: 10

# Hidden whisper meter. Dark deeds fill it; past threshold the voices start. It slowly drains.
whispers:
  threshold: 30
  decay_per_hour: 1.0
  # Characters with one of these RPCharacters traits fill the meter faster (the evil fast route).
  fast_traits: [heretic]
  fast_multiplier: 3.0
  sources:
    # Killing a listed animal with a blade.
    animal_kill: 2.0
    # Animal kills count this many times more at night or with nobody near.
    alone_or_night_multiplier: 2.0
    # A character you killed died for good.
    character_kill: 15.0
    # Every ten minutes while your equilibrium is at or below corruption_below.
    corruption: 1.0
    corruption_below: -40
  animal_types: [COW, PIG, SHEEP, CHICKEN, GOAT, RABBIT, HORSE, DONKEY, MULE, LLAMA, CAMEL, MOOSHROOM, WOLF, FOX, CAT, OCELOT, PARROT]

# The two voices. The god is Lorvear, the first vampire, the Blood Father: ancient, regal and paternal,
# he speaks in red and calls the mage "child". The other voice sounds like the mage's own thoughts, but it
# is the Void Reaper, working on them unseen: it argues against kneeling at the question (choice lines,
# half the time) and is all a mage hears once they refuse. It never names itself; it only hints at the
# quiet, the cold and the empty. Grey with a touch of the void.
# whispered lines are said in order and end with the knife and altar; other stages pick at random.
voices:
  # Minutes between lines, picked at random in this range.
  interval_minutes: [15, 35]
  # Only speak when no other player is within alone_radius blocks.
  require_alone: true
  alone_radius: 24
  god:
    style: "#8a0303§o"
    sound: minecraft:ambient.cave
    pitch: 0.5
    lines:
      whispered:
        - "...there. Under the stone. A heartbeat that is not your own."
        - "Do not be afraid. It has been so long since anyone listened."
        - "So much warm blood walks the roads. Spilled in ditches and brawls and childbeds. All of it wasted."
        - "One called Alaric listened, once, long before your grandfather's grandfather. He wasted nothing."
        - "Go down, deep, where the sky cannot follow. No banner, no warden's eye. Lay the stone there."
        - "Bring living beasts down to it. Hold them still with the plain knife, and let the stone drink."
        - "Not beasts of your own. A gift that costs nothing is no gift. Take them from another's pen while the keeper sleeps."
        - "Seven kinds, one each day and no sooner. I can wait. I have waited longer than your kingdoms have had names."
        - "Look in your pack. Someone has been generous. Do not make them regret it."
      animal:
        - "The stone is thirsty, child. Can you not hear it?"
        - "Every pen in the valley is full, and every shepherd sleeps."
        - "Lead it down gently. Fear sours the blood."
        - "Look into its eyes when you do it. I want to see what you see."
        - "I remember the taste of the last one. Bring me a kind I have not had."
        - "Wash your hands before you climb back up. They can smell it on you."
        - "The Lady in her tower would call this wickedness. Let her. She has never been hungry."
      choice:
        - "Seven kinds have bled. Come down to the stone, and bring the curved blade. Your father has a question."
        - "The stone is red to its heart. Kneel at it with the blade in your hand, child."
        - "Do not keep me waiting. Nothing in all of Cerrith has ever kept me waiting."
      final:
        - "You are my child now, and so are they. I will tell you which of them."
        - "I have chosen for you. You need not think any more. Only go to the stone."
        - "Do you remember their laugh? Remember it on the stone. It makes them sweeter."
        - "They trust you. That is what makes it holy."
        - "The Reaper hoards the dead. I prefer them warm, and given freely by someone they loved."
        - "Every drop you give me, I remember. Every drop, I repay."
      ascended:
        - "All of them, given. Sleep now, my child. Your father will wake you when he is hungry."
        - "You walk among them and none of them know. You are more mine than Alaric ever was."
        - "Let the Lady send her hunters. I have outlived every one of them."
  self:
    style: "#6e6878§o"
    sound: minecraft:entity.warden.heartbeat
    pitch: 1.2
    lines:
      choice:
        - "Kneel? To him? I have never knelt to anyone."
        - "Father. As if I need another one."
        - "Everything he gives, he owns. What if I took it, and owed no one?"
        - "He wants a child on its knees. I could be so much more than his child."
        - "Listen past his voice. Underneath it there is a quiet. The quiet is honest."
      hunt:
        - "I don't need a father to tell me what I want."
        - "Lorvear went quiet. Let him sulk under his stone. I can hear myself think."
        - "Strangers are cheap. The ones I know are worth more. I knew that before anyone told me."
        - "Nobody notices one more empty chair. Not at first."
        - "Seven measures. I keep counting, even when I pretend I'm not."
        - "They smiled at me today. They have no idea."
        - "Warm, he wanted them. Why warm? Cold keeps."
      final:
        - "It has to be them. I've known it for days."
        - "The closer they are, the more it gives. That's the whole trick, isn't it?"
        - "I'll be quick. I owe them that much."
        - "If I stop now, everything before was for nothing."
        - "Their name keeps coming back. Of course it does."
        - "Afterwards it is so still. I could live in that stillness."
      ascended:
        - "There is no one left I would miss. So this is what freedom feels like."
        - "The Lady would call me evil. She'd be right. And far too late."
        - "Quiet. So quiet. No god, no father. I did it all myself."
        - "...and in the quiet, something old and patient is smiling. It sounds like me."

# Animal sacrifices: bind a living animal on the altar with the ritual knife, then kill it with that knife.
animal:
  species_required: 7
  # Rolling window between two animal sacrifices.
  cooldown_hours: 24
  # How close to the altar the animal must be when the knife binds it.
  bind_range: 4
  # A bound animal breaks free after this many seconds.
  bind_seconds: 20
  # Only animals another player owns (Cooking husbandry) count.
  require_stolen: true
  # The offering leaves no meat or experience behind.
  clear_drops: true
  species: [COW, PIG, SHEEP, CHICKEN, GOAT, RABBIT, HORSE, DONKEY, MULE, LLAMA, CAMEL, MOOSHROOM, WOLF, FOX, CAT, OCELOT, PARROT]
  # Where a stolen animal was led away from, a small trace stays this long.
  trace:
    model: ia.tfmc_blood:trace
    hours: 6
  # The owner hears about it this many minutes later, or on their next login.
  note_delay_minutes: 30

# How the altar changes the room. Every change is remembered and undone when the altar is purified.
corruption:
  # Per altar level: reach in blocks and the most blocks it may have changed in total.
  levels:
    0: { radius: 2, max_blocks: 4 }
    1: { radius: 3, max_blocks: 8 }
    2: { radius: 3, max_blocks: 14 }
    3: { radius: 4, max_blocks: 28 }
    4: { radius: 5, max_blocks: 45 }
    5: { radius: 6, max_blocks: 70 }
  blocks_per_sacrifice: 3
  ambient_every_minutes: 30
  # Solid blocks with a face in the open turn into one of "to" (repeat an entry to weigh it).
  convert:
    - { min_level: 0, from: [STONE, COBBLESTONE, ANDESITE, DIORITE, GRANITE, STONE_BRICKS, DEEPSLATE, COBBLED_DEEPSLATE, TUFF], to: [CRACKED_STONE_BRICKS, MOSSY_COBBLESTONE] }
    - { min_level: 2, from: [STONE, COBBLESTONE, STONE_BRICKS, CRACKED_STONE_BRICKS, MOSSY_COBBLESTONE, DEEPSLATE, DIRT], to: [NETHER_BRICKS, CRACKED_NETHER_BRICKS, NETHERRACK] }
    - { min_level: 3, from: [DIRT, COARSE_DIRT, ROOTED_DIRT, NETHERRACK, STONE, DEEPSLATE], to: [CRIMSON_NYLIUM] }
    - { min_level: 4, from: [NETHER_BRICKS, CRACKED_NETHER_BRICKS, STONE_BRICKS, STONE], to: [RED_NETHER_BRICKS, BONE_BLOCK, NETHER_WART_BLOCK] }
  # Air spots get decorated: at floor = on top of a solid block, at ceiling = hanging under one.
  decorate:
    - { min_level: 0, at: floor, to: [REDSTONE_WIRE, REDSTONE_WIRE, RED_CANDLE] }
    - { min_level: 1, at: floor, to: [COBWEB] }
    - { min_level: 2, at: floor, to: [WITHER_ROSE] }
    - { min_level: 3, at: ceiling, to: [WEEPING_VINES] }
    - { min_level: 3, at: floor, to: [CRIMSON_ROOTS, NETHER_SPROUTS] }
    - { min_level: 4, at: floor, to: [SKELETON_SKULL, BONE_BLOCK] }

# The god's question: right-click your altar with your blood knife once the seventh kind is given.
choice:
  title: "#5c0202The Blood Father asks"
  question:
    - "#8a0303§oSeven kinds have bled for me, child, and you did not flinch."
    - "#8a0303§oKneel, and be my child. I will carry you all the way."
    - "#8a0303§oOr stand alone, and carry the weight yourself. Forever."
  devotee:
    item: v.red_dye
    name: "#8a0303I kneel to Lorvear"
    lore:
      - "#8c8c8c§oPart of you stays on the stone,"
      - "#8c8c8c§oa wound that will never close."
      - "#8c8c8c§oThe Blood Father walks with you, and chooses for you."
  "true":
    item: v.iron_sword
    name: "#bfbfbfI kneel to no one"
    lore:
      - "#6e6878§oI never needed him. I never did."
      - "#8c8c8c§oNo father. No voices. No one to blame."
      - "#8c8c8c§oOnly you, and what you take"
      - "#8c8c8c§ofrom the people who love you."
  confirm:
    item: v.redstone
    name: "#ff5555There is no going back"
    lore:
      - "#8c8c8c§oThe stone will remember what you chose."
  back:
    item: v.barrier
    name: "#aaaaaaNot yet"
    lore:
      - "#8c8c8c§oHe will wait. He is very good at waiting."
  # Permanent injuries a devotee keeps as the mark of what they gave.
  devotee_injuries: 2

# Hidden MMOCore classes (options.display: false) unlocked for the character through RPCharacters.
classes:
  devotee: bloodsworn
  "true": sanguinar

# Permissions a character on each path holds while it is played (one or a list), e.g. to see the
# hidden Wild Mage Sets skin category (magic.wild) and the path's skins in it. They follow the
# character: another character of the same player has none.
permissions:
  devotee: [magic.blood.bloodsworn, magic.wild]
  "true": magic.blood.sanguinar

# Bound, unbreakable armour. Devotees get theirs at the question; the true path when the hunt is done.
# Each piece is a TLibs item path (the stats), optionally with an ia. look put over it:
#   - m.type.id    or    - { item: m.type.id, look: ia.namespace:id }
# A piece's name may use {victim}: the true path's armour is made from the hunt's victims, the most
# important (most points, then closest) on the first named piece and so on down; with fewer victims
# than pieces the names start over from the top. Without victims the item keeps its own name.
armour:
  devotee:
    - { item: m.mage_armors.bloodsworn_helmet, look: ia.tfmc_blood:bloodsworn_helmet }
    - { item: m.mage_armors.bloodsworn_chestplate, look: ia.tfmc_blood:bloodsworn_chestplate }
    - { item: m.mage_armors.bloodsworn_leggings, look: ia.tfmc_blood:bloodsworn_leggings }
    - { item: m.mage_armors.bloodsworn_boots, look: ia.tfmc_blood:bloodsworn_boots }
  "true":
    - { item: m.mage_armors.sanguinar_helmet, look: ia.tfmc_blood:sanguinar_helmet, name: "#5c0202{victim} Skull" }
    - { item: m.mage_armors.sanguinar_chestplate, look: ia.tfmc_blood:sanguinar_chestplate, name: "#5c0202{victim} Ribcage" }
    - { item: m.mage_armors.sanguinar_leggings, look: ia.tfmc_blood:sanguinar_leggings, name: "#5c0202{victim} Hide" }
    - { item: m.mage_armors.sanguinar_boots, look: ia.tfmc_blood:sanguinar_boots, name: "#5c0202{victim} Bones" }

# Sounds and particles for every moment of the path. Each moment is a list of layers:
#   sound: <key> (volume, pitch)
#   particle: <Bukkit Particle> (count, spread: n or [x, y, z], speed, y offset, color/to/size for dust,
#     block for BLOCK/FALLING_DUST/BLOCK_CRUMBLE, item for ITEM, value for SCULK_CHARGE/SHRIEK)
#   shape: point | ring | column | spiral (radius, points, height); delay: ticks; private: true = only the
#   player the moment is about sees or hears it. A moment with no entry plays nothing.
fx:
  enabled: true
  moments:
    # --- The altar ---
    altar_placed:
      - { sound: block.stone.place, volume: 1.0, pitch: 0.5 }
      - { sound: block.sculk_catalyst.bloom, volume: 0.6, pitch: 0.6, delay: 6 }
      - { particle: BLOCK_CRUMBLE, block: stone_bricks, count: 30, spread: 0.4, y: 0.1 }
      - { particle: SCULK_SOUL, shape: ring, radius: 0.9, points: 14, y: -0.4, speed: 0.02, delay: 6 }
      - { sound: ambient.cave, volume: 0.5, pitch: 0.5, delay: 20, private: true }
    altar_awakens:
      - { sound: entity.warden.heartbeat, volume: 1.2, pitch: 0.5 }
      - { sound: block.sculk_shrieker.shriek, volume: 0.5, pitch: 0.5, delay: 4 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.6, shape: spiral, radius: 0.8, height: 2.2, points: 40, y: -0.5, delay: 4 }
      - { particle: FALLING_DUST, block: redstone_block, count: 18, spread: [0.45, 0.1, 0.45], y: 0.55, delay: 10 }
    altar_purified:
      - { sound: block.beacon.deactivate, volume: 1.0, pitch: 0.6 }
      - { sound: block.fire.extinguish, volume: 0.8, pitch: 0.5 }
      - { particle: WHITE_ASH, count: 60, spread: [1.2, 0.8, 1.2], y: 0.5 }
      - { particle: END_ROD, shape: column, height: 2.5, points: 12, speed: 0.02 }
      - { particle: LARGE_SMOKE, count: 12, spread: 0.3, y: 0.4, speed: 0.02 }
    altar_touch_owner:
      - { sound: entity.warden.heartbeat, volume: 0.6, pitch: 1.2, private: true }
      - { particle: DUST, color: "#8a0303", size: 1.0, count: 6, spread: 0.25, y: 0.6, private: true }
    altar_touch_stranger:
      - { sound: block.stone.hit, volume: 0.6, pitch: 0.6 }
      - { sound: ambient.soul_sand_valley.mood, volume: 0.3, pitch: 1.6, private: true }
    # Every 3 seconds while someone is within 24 blocks, by altar level (level 0 stays silent).
    altar_ambient_1:
      - { particle: FALLING_DUST, block: redstone_block, count: 1, spread: [0.35, 0, 0.35], y: 0.45 }
    altar_ambient_2:
      - { particle: FALLING_DUST, block: redstone_block, count: 2, spread: [0.4, 0, 0.4], y: 0.45 }
      - { particle: DUST, color: "#4a0000", size: 1.2, count: 3, spread: 0.3, y: 0.7 }
    altar_ambient_3:
      - { particle: FALLING_DUST, block: redstone_block, count: 3, spread: [0.45, 0, 0.45], y: 0.45 }
      - { particle: DUST, color: "#4a0000", size: 1.4, count: 4, spread: 0.35, y: 0.8 }
      - { particle: CRIMSON_SPORE, count: 6, spread: 1.5, y: 0.8 }
      - { sound: block.pointed_dripstone.drip_lava, volume: 0.4, pitch: 0.6 }
    altar_ambient_4:
      - { particle: FALLING_DUST, block: redstone_block, count: 4, spread: [0.45, 0, 0.45], y: 0.45 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 1.4, shape: ring, radius: 0.75, points: 10, y: 0.6 }
      - { particle: CRIMSON_SPORE, count: 10, spread: 2.0, y: 1.0 }
      - { sound: block.pointed_dripstone.drip_lava, volume: 0.5, pitch: 0.5 }
      - { sound: entity.warden.heartbeat, volume: 0.25, pitch: 0.6, delay: 20 }
    altar_ambient_5:
      - { particle: FALLING_DUST, block: redstone_block, count: 6, spread: [0.5, 0, 0.5], y: 0.45 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.6, shape: spiral, radius: 0.7, height: 1.6, points: 24, y: 0.4 }
      - { particle: SCULK_SOUL, count: 2, spread: 0.3, y: 0.7, speed: 0.01 }
      - { particle: CRIMSON_SPORE, count: 16, spread: 2.5, y: 1.0 }
      - { sound: entity.warden.heartbeat, volume: 0.5, pitch: 0.5 }
      - { sound: ambient.crimson_forest.additions, volume: 0.4, pitch: 0.6, delay: 30 }
    corruption:
      - { sound: block.sculk.spread, volume: 0.6, pitch: 0.6 }
      - { particle: SCULK_CHARGE, value: 0, count: 4, spread: 0.4 }
      - { particle: DUST, color: "#4a0000", size: 1.2, count: 6, spread: 0.45 }

    # --- The animals ---
    animal_bound:
      - { sound: block.chain.place, volume: 1.0, pitch: 0.6 }
      - { sound: entity.warden.heartbeat, volume: 0.8, pitch: 1.4, delay: 5 }
      - { particle: SCULK_SOUL, shape: ring, radius: 0.8, points: 12, y: 0.6, speed: 0.01 }
      - { particle: DUST, color: "#4a0000", size: 1.3, shape: column, height: 1.4, points: 10, y: 0.5 }
    animal_binding:
      - { particle: DAMAGE_INDICATOR, count: 2, spread: 0.2, y: 0.6 }
      - { particle: DUST, color: "#8a0303", size: 0.9, count: 3, spread: 0.3, y: 0.4 }
      - { sound: entity.warden.heartbeat, volume: 0.5, pitch: 1.3 }
    animal_escaped:
      - { sound: block.chain.break, volume: 0.8, pitch: 0.8 }
      - { particle: POOF, count: 8, spread: 0.3, y: 0.5 }
    animal_slain:
      - { sound: entity.player.attack.sweep, volume: 1.0, pitch: 0.7 }
      - { sound: item.trident.hit, volume: 1.0, pitch: 0.6 }
      - { sound: entity.generic.drink, volume: 0.8, pitch: 0.5, delay: 2 }
      - { particle: SWEEP_ATTACK, count: 1, y: 0.6 }
      - { particle: BLOCK, block: redstone_block, count: 25, spread: 0.3, y: 0.6, speed: 0.15 }
      - { particle: DUST, color: "#8a0303", size: 1.4, count: 12, spread: 0.4, y: 0.4 }
    animal_sacrificed:
      - { sound: entity.player.attack.crit, volume: 1.0, pitch: 0.5 }
      - { sound: block.honey_block.slide, volume: 1.0, pitch: 0.5 }
      - { sound: block.sculk_catalyst.bloom, volume: 0.8, pitch: 0.5, delay: 4 }
      - { sound: entity.warden.heartbeat, volume: 1.0, pitch: 0.6, delay: 12 }
      - { particle: BLOCK, block: redstone_block, count: 40, spread: 0.4, y: 0.7, speed: 0.1 }
      - { particle: DAMAGE_INDICATOR, count: 12, spread: 0.3, y: 0.6, speed: 0.05 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.5, shape: ring, radius: 1.2, points: 20, y: 0.6, delay: 4 }
      - { particle: SCULK_SOUL, shape: column, height: 1.8, points: 8, y: 0.6, speed: 0.03, delay: 8 }
    blood_knife_given:
      - { sound: entity.warden.emerge, volume: 0.7, pitch: 0.7, delay: 20 }
      - { sound: block.end_portal.spawn, volume: 0.4, pitch: 0.5, delay: 40 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 2.0, shape: spiral, radius: 1.3, height: 3.5, points: 70, y: -0.5, delay: 20 }
      - { particle: SCULK_SOUL, shape: ring, radius: 2.2, points: 30, y: -0.4, speed: 0.04, delay: 30 }
      - { particle: SONIC_BOOM, count: 1, y: 1.4, delay: 40 }
      - { sound: ambient.cave, volume: 1.0, pitch: 0.5, delay: 50, private: true }

    # --- The question ---
    question:
      - { sound: block.portal.ambient, volume: 0.4, pitch: 0.5, private: true }
      - { sound: entity.warden.nearby_closest, volume: 0.8, pitch: 0.5, private: true }
      - { particle: DUST, color: "#1a0000", size: 2.0, shape: ring, radius: 1.0, points: 16, y: 0.1, private: true }
    devoted:
      - { sound: entity.warden.roar, volume: 0.7, pitch: 0.5 }
      - { sound: entity.player.hurt, volume: 1.0, pitch: 0.6, delay: 10 }
      - { sound: block.respawn_anchor.charge, volume: 0.8, pitch: 0.5, delay: 20 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#4a0000", size: 1.8, shape: spiral, radius: 0.9, height: 2.4, points: 50 }
      - { particle: DAMAGE_INDICATOR, count: 20, spread: [0.3, 0.6, 0.3], y: 1.0, speed: 0.1, delay: 10 }
      - { particle: BLOCK, block: redstone_block, count: 30, spread: 0.4, y: 1.0, delay: 10 }
      - { particle: SCULK_SOUL, shape: ring, radius: 1.6, points: 24, speed: 0.03, delay: 20 }
    refused:
      - { sound: block.respawn_anchor.deplete, volume: 1.0, pitch: 0.5 }
      - { sound: block.candle.extinguish, volume: 1.0, pitch: 0.5, delay: 8 }
      - { sound: entity.elder_guardian.curse, volume: 0.5, pitch: 0.5, delay: 30, private: true }
      - { particle: LARGE_SMOKE, count: 30, spread: [0.6, 1.0, 0.6], y: 1.0, speed: 0.01 }
      - { particle: SQUID_INK, shape: ring, radius: 1.4, points: 20, y: 0.2, delay: 8 }

    # --- Dragging and the rite ---
    carry_start:
      - { sound: entity.player.attack.knockback, volume: 0.8, pitch: 0.6 }
      - { sound: block.chain.step, volume: 0.8, pitch: 0.6 }
      - { sound: entity.warden.heartbeat, volume: 1.0, pitch: 1.6, private: true }
      - { particle: DUST, color: "#8a0303", size: 1.2, count: 8, spread: 0.3, y: 0.2 }
    # Every few steps: the scrape of a body and a smear of blood on the ground behind it.
    carry_drag:
      - { sound: block.mud.step, volume: 0.6, pitch: 0.6 }
      - { particle: DUST, color: "#5c0202", size: 1.4, count: 3, spread: [0.25, 0, 0.25], y: 0.05 }
      - { particle: BLOCK, block: redstone_block, count: 2, spread: 0.15, y: 0.1 }
    carry_released:
      - { sound: entity.player.small_fall, volume: 1.0, pitch: 0.6 }
      - { particle: BLOCK_CRUMBLE, block: dirt, count: 10, spread: 0.3, y: 0.1 }
    rite_bound:
      - { sound: block.chain.place, volume: 1.0, pitch: 0.5 }
      - { sound: block.sculk_shrieker.shriek, volume: 0.7, pitch: 0.5, delay: 6 }
      - { particle: SCULK_SOUL, shape: ring, radius: 1.3, points: 20, y: -0.4, speed: 0.02 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 1.6, shape: column, height: 2.5, points: 16, y: 0.5, delay: 6 }
      - { sound: entity.elder_guardian.curse, volume: 0.6, pitch: 0.4, private: true }
    # Every second of the rite.
    rite_beat:
      - { sound: entity.warden.heartbeat, volume: 1.2, pitch: 0.7 }
      - { particle: DAMAGE_INDICATOR, count: 4, spread: 0.3, y: 1.0 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 1.4, shape: ring, radius: 1.0, points: 14, y: 0.6 }
      - { particle: SCULK_SOUL, count: 2, spread: 0.6, y: 0.2, speed: 0.02 }
      - { sound: entity.warden.heartbeat, volume: 1.0, pitch: 1.0, delay: 10, private: true }
    rite_broken:
      - { sound: block.chain.break, volume: 1.0, pitch: 0.6 }
      - { sound: block.glass.break, volume: 0.6, pitch: 0.5 }
      - { particle: LARGE_SMOKE, count: 16, spread: 0.4, y: 0.8, speed: 0.02 }
    rite_complete:
      - { sound: entity.warden.sonic_boom, volume: 0.8, pitch: 0.6 }
      - { sound: block.honey_block.slide, volume: 1.0, pitch: 0.4 }
      - { sound: entity.lightning_bolt.thunder, volume: 0.4, pitch: 0.5, delay: 6 }
      - { sound: block.sculk_catalyst.bloom, volume: 1.0, pitch: 0.4, delay: 12 }
      - { particle: SONIC_BOOM, count: 1, y: 1.0 }
      - { particle: BLOCK, block: redstone_block, count: 80, spread: 0.6, y: 0.9, speed: 0.15 }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 2.0, shape: ring, radius: 1.5, points: 30, y: 0.5, delay: 3 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 2.0, shape: ring, radius: 2.6, points: 42, y: 0.3, delay: 7 }
      - { particle: SCULK_SOUL, shape: spiral, radius: 0.6, height: 3.0, points: 30, y: 0.5, speed: 0.02, delay: 10 }

    # --- The hunt and the finals ---
    hunt_complete:
      - { sound: entity.warden.emerge, volume: 0.8, pitch: 0.6 }
      - { sound: block.end_portal.spawn, volume: 0.5, pitch: 0.5, delay: 20 }
      - { sound: entity.wither.ambient, volume: 0.4, pitch: 0.5, delay: 40, private: true }
      - { particle: DUST_COLOR_TRANSITION, color: "#c40c0c", to: "#1a0000", size: 2.2, shape: spiral, radius: 1.2, height: 3.0, points: 70 }
      - { particle: SOUL_FIRE_FLAME, shape: ring, radius: 1.8, points: 28, y: 0.1, speed: 0.01, delay: 20 }
      - { particle: SCULK_SOUL, count: 30, spread: [1.0, 1.5, 1.0], y: 1.0, speed: 0.02, delay: 30 }
    target_named:
      - { sound: block.bell.resonate, volume: 0.6, pitch: 0.5, private: true }
      - { sound: entity.elder_guardian.curse, volume: 0.4, pitch: 0.5, delay: 10, private: true }
      - { particle: DUST, color: "#1a0000", size: 1.6, count: 20, spread: [0.6, 1.0, 0.6], y: 1.0, private: true }
    final_taken:
      - { sound: block.bell.use, volume: 0.8, pitch: 0.5, delay: 20 }
      - { sound: entity.wither.ambient, volume: 0.3, pitch: 0.6, delay: 30, private: true }
      - { particle: SOUL, shape: ring, radius: 1.2, points: 18, y: 0.1, speed: 0.02, delay: 20 }
    ascended:
      - { sound: entity.ender_dragon.growl, volume: 0.6, pitch: 0.5, delay: 20 }
      - { sound: entity.wither.spawn, volume: 0.3, pitch: 0.5, delay: 40 }
      - { sound: block.end_portal.spawn, volume: 0.6, pitch: 0.4, delay: 60 }
      - { particle: DUST_COLOR_TRANSITION, color: "#ff1a1a", to: "#1a0000", size: 2.5, shape: spiral, radius: 1.5, height: 4.0, points: 90, delay: 20 }
      - { particle: SONIC_BOOM, count: 1, y: 1.2, delay: 40 }
      - { particle: SOUL_FIRE_FLAME, shape: ring, radius: 2.5, points: 40, y: 0.1, speed: 0.02, delay: 40 }
      - { particle: CRIMSON_SPORE, count: 80, spread: [3.0, 2.0, 3.0], y: 1.5, delay: 60 }
    backlash:
      - { sound: entity.player.hurt, volume: 1.0, pitch: 0.5 }
      - { sound: entity.elder_guardian.curse, volume: 0.6, pitch: 0.6, private: true }
      - { sound: entity.witch.celebrate, volume: 0.6, pitch: 0.5, delay: 20, private: true }
      - { particle: DAMAGE_INDICATOR, count: 12, spread: [0.3, 0.6, 0.3], y: 1.0, speed: 0.1 }
      - { particle: SQUID_INK, count: 16, spread: 0.5, y: 1.0, speed: 0.02 }

    # --- The voices ---
    voice_god:
      - { particle: DUST, color: "#8a0303", size: 0.8, count: 6, spread: [0.6, 0.4, 0.6], y: 1.7, private: true }
      - { sound: ambient.crimson_forest.mood, volume: 0.25, pitch: 0.6, private: true }
    voice_self:
      - { particle: SMOKE, count: 8, spread: [0.4, 0.3, 0.4], y: 1.6, speed: 0.005, private: true }
      - { particle: REVERSE_PORTAL, count: 4, spread: [0.3, 0.2, 0.3], y: 1.7, speed: 0.01, private: true }
      - { sound: block.portal.ambient, volume: 0.12, pitch: 1.8, private: true }
    gift:
      - { sound: entity.warden.nearby_closer, volume: 0.6, pitch: 0.6, private: true }
      - { particle: DUST, color: "#4a0000", size: 1.5, shape: ring, radius: 0.8, points: 12, y: 0.2, private: true }

    # --- The armour ---
    armour_given:
      - { sound: item.armor.equip_leather, volume: 1.0, pitch: 0.6 }
      - { sound: entity.warden.heartbeat, volume: 0.8, pitch: 0.8, delay: 6 }
      - { particle: DUST_COLOR_TRANSITION, color: "#8a0303", to: "#1a0000", size: 1.4, shape: column, height: 2.0, points: 14 }
    armour_crumbles:
      - { sound: entity.item.break, volume: 1.0, pitch: 0.5 }
      - { sound: block.soul_sand.break, volume: 0.8, pitch: 0.6 }
      - { particle: ASH, count: 30, spread: [0.3, 0.6, 0.3], y: 1.0 }
      - { particle: DUST, color: "#3a1a1a", size: 1.2, count: 12, spread: 0.4, y: 0.8 }
