# Pedestal shrine scan. Radius is Chebyshev (4 = 9x9x9 cube, center skipped).
# Typical shrine is a dressed floor plus foliage, not a packed cube. Family max_count
# is sized for that, so a larger radius only gives more room to build, not a higher bar.
# Score is per element. Lava is shared by oseni and seithr; water by cerrith and mitlan.
# scenery_charge: false on an element turns off block-tick fill for that school.
# Admin /magic shrine fill still works. Jar does not overwrite a live copy of this file.
radius: 4
min_score: 0.15
full_charge_seconds: 15
min_families: 2

# Shrine VFX. Volume also sets hear distance (16 * volume blocks). Keep at least 1.
# Elements only list diffs from default.
fx:
  default:
    ambient_sound: BLOCK_AMETHYST_BLOCK_CHIME
    ambient_volume: 1.0
    ambient_pitch: 1.4
    ambient_every_ticks: 24
    start_sound: BLOCK_AMETHYST_BLOCK_RESONATE
    start_volume: 1.0
    start_pitch: 1.2
    complete_sound: BLOCK_ENCHANTMENT_TABLE_USE
    complete_volume: 1.15
    complete_pitch: 1.15
    complete_sound_2: BLOCK_AMETHYST_BLOCK_RESONATE
    complete_volume_2: 1.0
    complete_pitch_2: 1.3
    trail_particle: ENCHANT
    emitter_particle: ENCHANT
    burst_particle: FIREWORK
  cerrith:
    ambient_sound: BLOCK_GRASS_BREAK
    ambient_pitch: 1.55
    start_sound: BLOCK_CHERRY_LEAVES_BREAK
    complete_sound_2: BLOCK_GRASS_BREAK
    emitter_particle: SPORE_BLOSSOM_AIR
  oseni:
    ambient_sound: BLOCK_LAVA_POP
    ambient_pitch: 1.1
    start_sound: BLOCK_CAMPFIRE_CRACKLE
    complete_sound: BLOCK_FIRE_EXTINGUISH
    complete_pitch: 1.15
    complete_sound_2: BLOCK_LAVA_POP
    emitter_particle: FLAME
    burst_particle: LAVA
  seithr:
    ambient_sound: BLOCK_SNOW_BREAK
    ambient_pitch: 1.5
    start_sound: BLOCK_POWDER_SNOW_BREAK
    complete_sound_2: BLOCK_POWDER_SNOW_BREAK
    complete_pitch_2: 1.35
    emitter_particle: SNOWFLAKE
  mitlan:
    ambient_sound: BLOCK_POINTED_DRIPSTONE_DRIP_WATER
    ambient_pitch: 1.2
    start_sound: ITEM_BOTTLE_FILL
    complete_sound: ITEM_BUCKET_FILL
    complete_pitch: 1.25
    emitter_particle: DRIPPING_WATER
    burst_particle: BUBBLE_POP
  arcanum:
    emitter_particle: WITCH
  spirit:
    ambient_pitch: 1.7
    start_pitch: 1.45
    emitter_particle: SOUL
    burst_particle: END_ROD
  illusion:
    ambient_sound: BLOCK_CHORUS_FLOWER_GROW
    start_sound: BLOCK_CHORUS_FLOWER_DEATH
    complete_sound_2: ENTITY_ILLUSIONER_MIRROR_MOVE
    complete_pitch_2: 1.2
    emitter_particle: REVERSE_PORTAL
    burst_particle: PORTAL
  necromancy:
    ambient_sound: BLOCK_SCULK_SPREAD
    ambient_pitch: 0.85
    start_sound: BLOCK_SCULK_CHARGE
    complete_sound: BLOCK_SCULK_CATALYST_BLOOM
    complete_pitch: 0.9
    emitter_particle: SCULK_SOUL
    burst_particle: SOUL
  shadowmancy:
    ambient_sound: BLOCK_SCULK_CHARGE
    ambient_pitch: 0.7
    start_sound: BLOCK_CANDLE_EXTINGUISH
    complete_sound: BLOCK_CANDLE_EXTINGUISH
    complete_pitch: 0.75
    complete_sound_2: BLOCK_SCULK_SPREAD
    emitter_particle: SMOKE
    burst_particle: SQUID_INK
  bloodmagic:
    ambient_sound: BLOCK_HONEY_BLOCK_SLIDE
    ambient_pitch: 0.85
    start_sound: BLOCK_HONEY_BLOCK_PLACE
    complete_sound: BLOCK_WART_BLOCK_HIT
    complete_pitch: 0.9
    emitter_particle: DRIPPING_HONEY
    burst_particle: FALLING_HONEY

