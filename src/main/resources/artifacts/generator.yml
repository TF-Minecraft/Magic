template: m.miscellanea.template_artifact

# Primary types when no element is specified (dowsing magic.(rarity=...),
# /magic artifact roll, fillchest random). Affinity group id or list of type ids.
# Empty = every enabled type. Explicit types (magic.(primary=bloodmagic)) are unchanged.
random_pool: planar_four

rarities:
  common:
    name: Common
    color: "#7d9b6a"
    weight: 65
    elements: 1-1
    aura_cap: "10-25"
  uncommon:
