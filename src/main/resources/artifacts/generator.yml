    planar_four:
      - oseni
      - seithr
      - cerrith
      - mitlan
    death_arts:
      - necromancy
      - shadowmancy
      - bloodmagic
    with_arcanum:
      - arcanum
      - oseni
      - seithr
      - cerrith
      - mitlan
      - necromancy
      - shadowmancy
      - bloodmagic
      - spirit
      - illusion
    veil:
      - illusion
      - cerrith
    animus:
      - spirit
      - seithr
      - cerrith
  exclude:
    - never:
        - oseni
        - seithr
        - cerrith
        - mitlan
      with:
        - necromancy
        - shadowmancy
        - bloodmagic

